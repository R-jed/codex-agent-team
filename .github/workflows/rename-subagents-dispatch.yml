name: one-time-subagents-dispatch-rename

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    env:
      OPENAI_CODEX_PLUGIN_VALIDATOR_REF: 7750465934d97dd3cbcb3b1655d2f622744010d3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Rename complete public identity
        shell: bash
        run: |
          set -euo pipefail
          git mv plugins/codex-delegate plugins/subagents-dispatch
          git mv plugins/subagents-dispatch/skills/codex-delegate plugins/subagents-dispatch/skills/dispatch
          git mv plugins/subagents-dispatch/skills/codex-delegate-doctor plugins/subagents-dispatch/skills/doctor

          for file in plugins/subagents-dispatch/agent-profiles/codex-delegate-*.toml; do
            git mv "$file" "${file/codex-delegate-/subagents-dispatch-}"
          done
          for file in plugins/subagents-dispatch/assets/codex-delegate-*.svg; do
            git mv "$file" "${file/codex-delegate-/subagents-dispatch-}"
          done

          python - <<'PY'
          from pathlib import Path
          import subprocess

          files = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          replacements = [
              ("$codex-delegate:codex-delegate-doctor", "$subagents-dispatch:doctor"),
              ("$codex-delegate:codex-delegate", "$subagents-dispatch:dispatch"),
              ("R-jed/codex-delegate", "R-jed/subagents-dispatch"),
              ("skills/codex-delegate-doctor", "skills/doctor"),
              ("skills/codex-delegate", "skills/dispatch"),
              ("codex-delegate-doctor", "doctor"),
              ("Codex Delegate Doctor", "Doctor"),
              ("codex delegate doctor", "doctor"),
              ("Codex Delegate", "subagents-dispatch"),
              ("codex delegate", "subagents-dispatch"),
              ("codex_delegate", "subagents_dispatch"),
              ("codex-delegate", "subagents-dispatch"),
              ("1.3.0", "2.0.0"),
          ]

          for raw in files:
              if not raw:
                  continue
              path = Path(raw.decode())
              if not path.is_file():
                  continue
              data = path.read_bytes()
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              new = text
              for old, replacement in replacements:
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new, encoding="utf-8")

          skill = Path("plugins/subagents-dispatch/skills/dispatch/SKILL.md")
          text = skill.read_text(encoding="utf-8")
          text = text.replace("name: subagents-dispatch\n", "name: dispatch\n", 1)
          text = text.replace("# subagents-dispatch\n", "# dispatch\n", 1)
          skill.write_text(text, encoding="utf-8")

          dispatch_yaml = Path("plugins/subagents-dispatch/skills/dispatch/agents/openai.yaml")
          text = dispatch_yaml.read_text(encoding="utf-8")
          text = text.replace('display_name: "subagents-dispatch"', 'display_name: "Dispatch"')
          dispatch_yaml.write_text(text, encoding="utf-8")

          doctor_yaml = Path("plugins/subagents-dispatch/skills/doctor/agents/openai.yaml")
          text = doctor_yaml.read_text(encoding="utf-8")
          text = text.replace('display_name: "subagents-dispatch Doctor"', 'display_name: "Doctor"')
          doctor_yaml.write_text(text, encoding="utf-8")

          for path in Path("tests").glob("*.py"):
              text = path.read_text(encoding="utf-8")
              text = text.replace('SKILLS_ROOT / "subagents-dispatch"', 'SKILLS_ROOT / "dispatch"')
              text = text.replace('/ "skills" / "subagents-dispatch"', '/ "skills" / "dispatch"')
              path.write_text(text, encoding="utf-8")

          ai = Path("README_AI.md")
          text = ai.read_text(encoding="utf-8")
          text = text.replace("Main Skill:          subagents-dispatch", "Main Skill:          dispatch")
          text = text.replace("Doctor Skill:        subagents-dispatch-doctor", "Doctor Skill:        doctor")
          text = text.replace("`subagents-dispatch-doctor` is operational maintenance", "`doctor` is operational maintenance")
          ai.write_text(text, encoding="utf-8")

          for path in [Path("README.md"), Path("README_EN.md")]:
              text = path.read_text(encoding="utf-8")
              text = text.replace('<h1 align="center">subagents-dispatch-Plugin</h1>', '<h1 align="center">subagents-dispatch</h1>')
              path.write_text(text, encoding="utf-8")

          packaging = Path("tests/test_plugin_packaging.py")
          text = packaging.read_text(encoding="utf-8")
          guard = '''\n\ndef test_retired_public_identity_is_absent_from_current_tree():\n    retired_hyphen = "codex" + "-delegate"\n    retired_snake = "codex" + "_delegate"\n    for path in ROOT.rglob("*"):\n        if not path.is_file() or ".git" in path.parts:\n            continue\n        try:\n            content = path.read_text(encoding="utf-8")\n        except (UnicodeDecodeError, OSError):\n            continue\n        assert retired_hyphen not in content, path\n        assert retired_snake not in content, path\n'''
          if "test_retired_public_identity_is_absent_from_current_tree" not in text:
              packaging.write_text(text + guard, encoding="utf-8")
          PY

          git rm -f .github/workflows/rename-subagents-dispatch.yml

          if git grep -nE 'codex-delegate|codex_delegate|Codex Delegate|codex delegate'; then
            echo 'retired identity remains in tracked tree' >&2
            exit 1
          fi

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate manifests and official Plugin contract
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool plugins/subagents-dispatch/.codex-plugin/plugin.json >/dev/null
          python -m json.tool .agents/plugins/marketplace.json >/dev/null
          validator="$RUNNER_TEMP/openai-validate-plugin.py"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/openai/codex/${OPENAI_CODEX_PLUGIN_VALIDATOR_REF}/codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py" \
            --output "$validator"
          python "$validator" plugins/subagents-dispatch
      - name: Run full tests
        run: pytest -q
      - name: Verify managed Agent profile lifecycle
        shell: bash
        run: |
          set -euo pipefail
          tmp_home="$(mktemp -d)"
          python plugins/subagents-dispatch/scripts/install-agents.py --codex-home "$tmp_home"
          python plugins/subagents-dispatch/scripts/install-agents.py --codex-home "$tmp_home" --check
          python plugins/subagents-dispatch/scripts/install-agents.py --codex-home "$tmp_home"
      - name: Commit verified rename
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "refactor: rename project to subagents-dispatch"
          git push origin HEAD:main
