name: cleanup-retired-rename-branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Delete retired rename branch
        shell: bash
        run: git push origin --delete rename/subagents-dispatch
