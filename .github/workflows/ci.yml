name: policy-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate plugin manifests
        shell: bash
        run: |
          python -m json.tool plugins/codex-agent-team/.codex-plugin/plugin.json >/dev/null
          python -m json.tool .agents/plugins/marketplace.json >/dev/null
      - run: pytest -q
      - name: Verify managed Agent profile lifecycle
        shell: bash
        run: |
          target="$RUNNER_TEMP/codex-agent-team-companion"
          python plugins/codex-agent-team/scripts/install-agents.py --codex-home "$target"
          python plugins/codex-agent-team/scripts/install-agents.py --codex-home "$target" --check
          python plugins/codex-agent-team/scripts/install-agents.py --codex-home "$target"
