name: policy-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Verify installer transaction
        shell: bash
        run: |
          target="$RUNNER_TEMP/codex-agent-team"
          python scripts/install.py --codex-home "$target"
          python scripts/install.py --codex-home "$target" --check
