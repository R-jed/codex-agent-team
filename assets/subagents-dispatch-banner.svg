<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#059669"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#059669" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#059669" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="50" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V50" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <!-- 背景层次 -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <ellipse cx="880" cy="150" rx="280" ry="130" fill="url(#glow)"/>
  <rect x="-46" y="196" width="180" height="180" rx="26" fill="#2563eb" fill-opacity="0.10" transform="rotate(14 44 286)"/>
  <rect x="1072" y="-70" width="150" height="150" rx="26" fill="#d97706" fill-opacity="0.10" transform="rotate(-13 1147 -5)"/>
  <rect width="1200" height="3" fill="url(#accent)"/>

  <!-- 背景点阵 -->
  <circle cx="150" cy="60" r="1.6" fill="#ffffff" fill-opacity="0.14"/>
  <circle cx="320" cy="250" r="1.6" fill="#ffffff" fill-opacity="0.12"/>
  <circle cx="560" cy="40" r="1.4" fill="#ffffff" fill-opacity="0.10"/>
  <circle cx="250" cy="130" r="1.4" fill="#ffffff" fill-opacity="0.10"/>
  <circle cx="620" cy="262" r="1.6" fill="#ffffff" fill-opacity="0.12"/>
  <circle cx="1050" cy="250" r="1.4" fill="#ffffff" fill-opacity="0.10"/>
  <circle cx="1120" cy="60" r="1.6" fill="#ffffff" fill-opacity="0.12"/>

  <!-- 左侧品牌区 -->
  <text x="48" y="76" font-family="Menlo, Consolas, monospace" font-size="12" letter-spacing="2.5" fill="#10b981">CODEX PLUGIN · AGENT DISPATCH</text>

  <text x="48" y="135" font-family="Menlo, Consolas, monospace" font-size="40" font-weight="700" fill="#f8fafc">subagents-dispatch</text>
  <text x="48" y="170" font-family="Menlo, Consolas, monospace" font-size="16" fill="#94a3b8">One command · Parallel agents · Controlled results.</text>

  <rect x="48" y="188" width="120" height="2" fill="url(#accent)"/>

  <!-- 右侧调度图：Main 分派到 5 个子 Agent -->
  <text x="700" y="92" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#64748b">DISPATCH</text>

  <!-- 分派线 -->
  <path d="M733 150 C 812 150, 838 48, 920 48" stroke="#334155" stroke-width="2" fill="none"/>
  <path d="M733 150 C 812 150, 860 98, 1000 98" stroke="#334155" stroke-width="2" fill="none"/>
  <path d="M733 150 C 812 150, 880 150, 1030 150" stroke="#334155" stroke-width="2" fill="none"/>
  <path d="M733 150 C 812 150, 860 202, 1000 202" stroke="#334155" stroke-width="2" fill="none"/>
  <path d="M733 150 C 812 150, 838 252, 920 252" stroke="#334155" stroke-width="2" fill="none"/>

  <!-- 流向点 -->
  <circle cx="808" cy="86" r="2.4" fill="#2563eb"/>
  <circle cx="830" cy="118" r="2.4" fill="#059669"/>
  <circle cx="848" cy="150" r="2.4" fill="#d97706"/>
  <circle cx="830" cy="182" r="2.4" fill="#7c3aed"/>
  <circle cx="808" cy="214" r="2.4" fill="#e11d48"/>

  <!-- Main 节点 -->
  <rect x="667" y="128" width="66" height="44" rx="10" fill="#ffffff"/>
  <rect x="667" y="128" width="66" height="44" rx="10" fill="none" stroke="#10b981" stroke-width="2"/>
  <text x="700" y="156" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#0b1220">Main</text>

  <!-- 子 Agent 节点 -->
  <rect x="920" y="42" width="10" height="10" rx="2.5" fill="#2563eb"/>
  <text x="938" y="51" font-family="Menlo, Consolas, monospace" font-size="13" fill="#cbd5e1">Reader</text>
  <rect x="1000" y="92" width="10" height="10" rx="2.5" fill="#059669"/>
  <text x="1018" y="101" font-family="Menlo, Consolas, monospace" font-size="13" fill="#cbd5e1">Worker</text>
  <rect x="1030" y="144" width="10" height="10" rx="2.5" fill="#d97706"/>
  <text x="1048" y="153" font-family="Menlo, Consolas, monospace" font-size="13" fill="#cbd5e1">Solver</text>
  <rect x="1000" y="196" width="10" height="10" rx="2.5" fill="#7c3aed"/>
  <text x="1018" y="205" font-family="Menlo, Consolas, monospace" font-size="13" fill="#cbd5e1">Investigator</text>
  <rect x="920" y="246" width="10" height="10" rx="2.5" fill="#e11d48"/>
  <text x="938" y="255" font-family="Menlo, Consolas, monospace" font-size="13" fill="#cbd5e1">Advisor</text>
</svg>
