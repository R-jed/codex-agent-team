<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Codex Agent Team task example</title>
  <desc id="desc">A payment-callback concurrency issue starts with scope in the main session, moves to Luna when bounded implementation helps, adds Terra only for a real security review trigger, then returns for acceptance.</desc>
  <rect width="1200" height="600" fill="#f7f7f5"/>

  <line x1="60" y1="72" x2="1140" y2="72" stroke="#0a0a0a" stroke-width="1"/>
  <text x="60" y="44" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="600" fill="#0a0a0a">TASK EXAMPLE</text>
  <text x="1140" y="44" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="500" fill="#666661">PAYMENT CALLBACK · CONCURRENCY BUG</text>

  <text x="60" y="136" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="400" fill="#0a0a0a">The task shape decides whether a Subagent is created.</text>

  <g transform="translate(60 182)">
    <rect x="0" y="0" width="320" height="330" fill="#002FA7"/>
    <text x="28" y="52" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="600" fill="#ffffff">01 · SET SCOPE</text>
    <text x="28" y="112" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="38" font-weight="500" fill="#ffffff">MAIN SESSION</text>
    <text x="28" y="168" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="400" fill="#ffffff">map the callback path</text>
    <text x="28" y="212" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="400" fill="#ffffff">mark idempotency + security</text>
    <text x="28" y="256" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="400" fill="#ffffff">define acceptance checks</text>
    <text x="28" y="306" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="500" fill="#dfe6ff">already small → finish here</text>

    <rect x="350" y="0" width="410" height="330" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5"/>
    <text x="378" y="52" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="600" fill="#0a0a0a">02 · DELEGATE IF USEFUL</text>
    <text x="378" y="112" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="42" font-weight="500" fill="#002FA7">LUNA</text>
    <text x="378" y="160" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="400" fill="#0a0a0a">trace callback → payment → order</text>
    <text x="378" y="204" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="400" fill="#0a0a0a">change code · run relevant tests</text>
    <rect x="378" y="238" width="354" height="64" fill="#efefec" stroke="#002FA7" stroke-width="2"/>
    <text x="555" y="280" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="600" fill="#002FA7">SECURITY TRIGGER → TERRA REVIEW</text>

    <rect x="790" y="0" width="350" height="330" fill="#0a0a0a"/>
    <text x="818" y="52" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="600" fill="#bdbdb7">03 · ACCEPT</text>
    <text x="818" y="112" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="38" font-weight="500" fill="#ffffff">MAIN SESSION</text>
    <text x="818" y="168" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="400" fill="#ffffff">inspect the real diff</text>
    <text x="818" y="212" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="400" fill="#ffffff">inspect tests + evidence</text>
    <text x="818" y="256" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="400" fill="#ffffff">accept or keep fixing</text>
  </g>

  <line x1="60" y1="548" x2="1140" y2="548" stroke="#0a0a0a" stroke-width="1"/>
  <text x="60" y="582" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="500" fill="#666661">A step stays out when its trigger is absent.</text>
</svg>