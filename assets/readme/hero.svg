    <text x="4" y="214" font-family="Playfair Display, Georgia, Times New Roman, serif" font-size="24" font-weight="600" fill="#f1f3f5">Minimum team</text>
    <text x="4" y="252" font-family="Playfair Display, Georgia, Times New Roman, serif" font-size="24" font-weight="600" fill="#f1f3f5">Evidence first</text>
  </g>

  <text x="60" y="562" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#f1f3f5" opacity="0.72">NATIVE SUBAGENTS · DEPTH 1 · ONE WRITER · FAIL CLOSED</text>
