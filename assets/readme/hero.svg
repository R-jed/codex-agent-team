<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Codex Agent Team</title>
  <desc id="desc">The main session owns the full task. Luna, Terra, and Sol take bounded specialist responsibilities and return results for acceptance.</desc>
  <rect width="1200" height="500" fill="#f7f7f5"/>

  <g stroke="#0a0a0a" stroke-width="1" opacity="0.055">
    <line x1="60" y1="0" x2="60" y2="500"/>
    <line x1="240" y1="0" x2="240" y2="500"/>
    <line x1="420" y1="0" x2="420" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="780" y1="0" x2="780" y2="500"/>
    <line x1="960" y1="0" x2="960" y2="500"/>
    <line x1="1140" y1="0" x2="1140" y2="500"/>
  </g>

  <line x1="60" y1="72" x2="1140" y2="72" stroke="#0a0a0a" stroke-width="1"/>
  <text x="60" y="44" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="600" fill="#0a0a0a">CODEX AGENT TEAM</text>
  <text x="1140" y="44" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="500" fill="#666661">CODEX PLUGIN · NATIVE SUBAGENTS</text>

  <text x="60" y="176" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="300" fill="#0a0a0a">The main session owns the task.</text>
  <text x="60" y="246" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="300" fill="#0a0a0a">Subagents own bounded work.</text>
  <text x="60" y="300" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="500" fill="#666661">Scope, risk, and final acceptance stay in the current session.</text>

  <g transform="translate(60 356)">
    <rect x="0" y="0" width="160" height="84" fill="#efefec"/>
    <text x="80" y="53" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="500" fill="#0a0a0a">TASK</text>

    <line x1="160" y1="42" x2="200" y2="42" stroke="#0a0a0a" stroke-width="2"/>
    <polygon points="200,42 186,34 186,50" fill="#0a0a0a"/>

    <rect x="200" y="0" width="220" height="84" fill="#002FA7"/>
    <text x="310" y="53" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="600" fill="#ffffff">MAIN SESSION</text>

    <line x1="420" y1="42" x2="460" y2="42" stroke="#0a0a0a" stroke-width="2"/>
    <polygon points="460,42 446,34 446,50" fill="#0a0a0a"/>

    <rect x="460" y="0" width="340" height="84" fill="#ffffff" stroke="#002FA7" stroke-width="2"/>
    <text x="630" y="35" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="600" fill="#002FA7">LUNA · TERRA · SOL</text>
    <text x="630" y="67" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="500" fill="#0a0a0a">bounded specialist work</text>

    <line x1="800" y1="42" x2="840" y2="42" stroke="#0a0a0a" stroke-width="2"/>
    <polygon points="840,42 826,34 826,50" fill="#0a0a0a"/>

    <rect x="840" y="0" width="300" height="84" fill="#0a0a0a"/>
    <text x="990" y="53" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="500" fill="#ffffff">ACCEPTANCE</text>
  </g>
</svg>