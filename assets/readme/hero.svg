<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Codex Agent Team</title>
  <desc id="desc">Minimal Swiss-style title card for a small Native Subagent team controlled by the current Codex session.</desc>
  <rect width="1600" height="560" fill="#fafaf8"/>
  <rect width="16" height="560" fill="#002FA7"/>
  <g stroke="#d4d4d2" stroke-width="1">
    <line x1="96" y1="88" x2="1504" y2="88"/>
    <line x1="96" y1="456" x2="1504" y2="456"/>
    <line x1="1120" y1="88" x2="1120" y2="456"/>
  </g>
  <text x="96" y="58" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="2.4" fill="#737373">CODEX NATIVE SUBAGENTS / POLICY SKILL</text>
  <text x="96" y="228" font-family="Inter, Helvetica, Arial, sans-serif" font-size="92" font-weight="200" letter-spacing="-4" fill="#0a0a0a">CODEX</text>
  <text x="96" y="312" font-family="Inter, Helvetica, Arial, sans-serif" font-size="92" font-weight="200" letter-spacing="-4" fill="#002FA7">AGENT TEAM</text>
  <text x="101" y="368" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#737373">Small teams. Clear roles. Root stays in control.</text>
  <rect x="1170" y="150" width="278" height="64" fill="#0a0a0a"/>
  <text x="1197" y="190" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#fafaf8">ROOT / CONTROL</text>
  <rect x="1170" y="232" width="278" height="64" fill="#002FA7"/>
  <text x="1197" y="272" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff">LUNA / EXECUTION</text>
  <rect x="1170" y="314" width="278" height="64" fill="#fafaf8" stroke="#0a0a0a" stroke-width="2"/>
  <text x="1197" y="354" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0a0a0a">TERRA / REVIEW</text>
  <text x="96" y="505" font-family="JetBrains Mono, Menlo, monospace" font-size="14" font-weight="600" letter-spacing="1.2" fill="#737373">MINIMUM TEAM · DEPTH 1 · ONE WRITER · EVIDENCE FIRST</text>
</svg>