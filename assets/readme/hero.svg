  <text x="60" y="48" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="600" letter-spacing="1.1" fill="#f1f3f5" opacity="0.8">CODEX AGENT TEAM · COMMUNITY WORKFLOW PLUGIN</text>
  <text x="1140" y="48" text-anchor="end" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="600" letter-spacing="1" fill="#f1f3f5" opacity="0.8">TEAM ONLY WHEN USEFUL · 01</text>

  <text x="60" y="142" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="500" fill="#f1f3f5" opacity="0.72">You always work through one main session.</text>
  <text x="54" y="270" font-family="Playfair Display, Georgia, Times New Roman, serif" font-size="78" font-weight="700" letter-spacing="-1.8" fill="#f1f3f5">FORM A TEAM</text>
  <text x="54" y="360" font-family="Playfair Display, Georgia, Times New Roman, serif" font-size="78" font-weight="700" letter-spacing="-1.8" fill="#f1f3f5">ONLY WHEN IT HELPS.</text>

  <text x="60" y="424" font-family="Playfair Display, Georgia, Times New Roman, serif" font-size="29" font-weight="600" fill="#f1f3f5">Small work stays local. Specialist work gets a specialist.</text>
  <text x="60" y="468" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="500" fill="#f1f3f5" opacity="0.72">Luna executes · Terra reviews independently · Sol judges when needed</text>

  <g transform="translate(930 136)">
    <text x="0" y="104" font-family="Playfair Display, Georgia, Times New Roman, serif" font-size="150" font-weight="700" fill="#f1f3f5" opacity="0.92">01</text>
    <line x1="4" y1="136" x2="204" y2="136" stroke="#f1f3f5" stroke-width="1.4" opacity="0.68"/>
