<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Codex Agent Team</title>
  <desc id="desc">Indigo porcelain editorial cover. Form a team only when it helps, while the main session keeps direction, acceptance, and final delivery.</desc>
