<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Codex Agent Team</title>
  <desc id="desc">Minimal Swiss-style title card for Codex Agent Team.</desc>
  <rect width="1600" height="520" fill="#fafaf8"/>
  <line x1="80" y1="92" x2="1520" y2="92" stroke="#d4d4d2" stroke-width="1"/>
  <text x="80" y="62" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2" fill="#737373">CODEX NATIVE SUBAGENT POLICY</text>
