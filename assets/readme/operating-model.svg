<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Codex Agent Team operating model</title>
  <desc id="desc">One main session owns the full task. Luna, Terra, and Sol take bounded responsibilities only when execution, detached-review, or consent-gated judgment triggers are met, then return results for acceptance.</desc>
  <rect width="1200" height="700" fill="#f7f7f5"/>

  <line x1="60" y1="72" x2="1140" y2="72" stroke="#0a0a0a" stroke-width="1"/>
  <text x="60" y="44" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="600" fill="#0a0a0a">OPERATING MODEL</text>
  <text x="1140" y="44" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="500" fill="#666661">ONE MAIN SESSION · THREE SPECIALIST SUBAGENTS</text>

  <text x="60" y="134" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="300" fill="#0a0a0a">One main session. Three specialist Subagents.</text>
  <text x="60" y="178" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="500" fill="#666661">Every branch has a trigger. Without one, the work stays in the main session.</text>

  <rect x="60" y="228" width="300" height="342" fill="#002FA7"/>
  <text x="88" y="274" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="600" fill="#dfe6ff">FULL TASK</text>
  <text x="88" y="334" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="500" fill="#ffffff">MAIN SESSION</text>
  <text x="88" y="392" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="400" fill="#ffffff">understand intent · set scope</text>
  <text x="88" y="438" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="400" fill="#ffffff">own risk · define acceptance</text>
  <text x="88" y="520" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="500" fill="#dfe6ff">decide whether to delegate</text>

  <rect x="430" y="228" width="360" height="100" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5"/>
  <text x="456" y="269" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="600" fill="#002FA7">LUNA</text>
  <text x="456" y="304" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="500" fill="#0a0a0a">heavy tracing / bounded build → execute</text>

  <rect x="430" y="350" width="360" height="100" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5"/>
  <text x="456" y="391" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="600" fill="#002FA7">TERRA</text>
  <text x="456" y="426" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="500" fill="#0a0a0a">risky change / detached view matters → review</text>

  <rect x="430" y="472" width="360" height="100" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5"/>
  <text x="456" y="513" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="600" fill="#002FA7">SOL</text>
  <text x="456" y="548" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="500" fill="#0a0a0a">unresolved high consequence + consent → judge</text>

  <rect x="860" y="228" width="280" height="342" fill="#0a0a0a"/>
  <text x="888" y="274" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="600" fill="#bdbdb7">FINAL OWNERSHIP</text>
  <text x="888" y="334" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="500" fill="#ffffff">MAIN SESSION</text>
  <text x="888" y="392" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="400" fill="#ffffff">inspect the real diff</text>
  <text x="888" y="438" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="400" fill="#ffffff">inspect tests + evidence</text>
  <text x="888" y="484" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="400" fill="#ffffff">accept or keep fixing</text>

  <g stroke="#0a0a0a" stroke-width="2" fill="#0a0a0a">
    <line x1="360" y1="278" x2="430" y2="278"/><polygon points="430,278 416,270 416,286"/>
    <line x1="790" y1="278" x2="860" y2="278"/><polygon points="860,278 846,270 846,286"/>
    <line x1="360" y1="400" x2="430" y2="400"/><polygon points="430,400 416,392 416,408"/>
    <line x1="790" y1="400" x2="860" y2="400"/><polygon points="860,400 846,392 846,408"/>
    <line x1="360" y1="522" x2="430" y2="522"/><polygon points="430,522 416,514 416,530"/>
    <line x1="790" y1="522" x2="860" y2="522"/><polygon points="860,522 846,514 846,530"/>
  </g>

  <line x1="60" y1="620" x2="1140" y2="620" stroke="#0a0a0a" stroke-width="1"/>
  <rect x="60" y="646" width="18" height="18" fill="#002FA7"/>
  <text x="96" y="665" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="600" fill="#0a0a0a">Small, isolated work stays in the main session. No Subagent is required.</text>
</svg>