<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Codex Agent Team 中文封面</title>
  <desc id="desc">瑞士国际主义风格封面。当前会话负责掌控，Luna 执行，Terra 复核，Sol 仅在授权后参与裁决。</desc>
  <rect width="1200" height="520" fill="#fafaf8"/>
  <line x1="60" y1="72" x2="1140" y2="72" stroke="#d4d4d2" stroke-width="1"/>
  <line x1="60" y1="448" x2="1140" y2="448" stroke="#d4d4d2" stroke-width="1"/>

  <g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="60" y="48" font-size="20" font-weight="600" fill="#737373">CODEX 原生子代理 · 团队策略</text>
    <text x="60" y="190" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="86" font-weight="200" letter-spacing="-3.5" fill="#0a0a0a">CODEX</text>
    <text x="60" y="270" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="86" font-weight="200" letter-spacing="-3.5" fill="#0a0a0a">AGENT TEAM</text>
    <text x="64" y="326" font-size="28" font-weight="400" fill="#0a0a0a">需要时组队，始终由当前会话掌控。</text>
    <text x="64" y="366" font-size="22" font-weight="500" fill="#737373">执行交给 Luna · 独立复核交给 Terra · 高后果裁决需要用户授权</text>
    <text x="60" y="486" font-size="20" font-weight="600" fill="#737373">最小团队 · 单层委派 · 单写入者 · 证据优先</text>
  </g>

  <g>
    <rect x="835" y="126" width="248" height="124" fill="#0a0a0a"/>
    <text x="863" y="173" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#fafaf8">ROOT</text>
    <text x="863" y="211" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="500" fill="#fafaf8">规划 · 风险 · 验收</text>

    <rect x="903" y="274" width="180" height="94" fill="#002FA7"/>
    <text x="929" y="314" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#ffffff">LUNA</text>
    <text x="929" y="346" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="500" fill="#ffffff">执行 / 探索</text>

    <rect x="835" y="392" width="128" height="58" fill="#fafaf8" stroke="#0a0a0a" stroke-width="1.5"/>
    <text x="857" y="429" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a">TERRA</text>

    <rect x="987" y="392" width="96" height="58" fill="#f0f0ee"/>
    <text x="1009" y="429" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a">SOL</text>

    <path d="M959 250 V274" stroke="#0a0a0a" stroke-width="1.5"/>
    <path d="M959 368 V380 H899 V392" fill="none" stroke="#0a0a0a" stroke-width="1.5"/>
    <path d="M959 380 H1035 V392" fill="none" stroke="#0a0a0a" stroke-width="1.5"/>
