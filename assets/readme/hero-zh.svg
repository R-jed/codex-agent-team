<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Codex Agent Team 中文封面</title>
  <desc id="desc">主会话负责整个任务。Luna、Terra、Sol 只在条件满足时接手局部工作，结果回到主会话。</desc>
  <rect width="1200" height="460" fill="#f7f7f5"/>

  <line x1="60" y1="72" x2="1140" y2="72" stroke="#0a0a0a" stroke-width="1"/>
  <text x="60" y="44" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei UI, sans-serif" font-size="28" font-weight="600" fill="#0a0a0a">CODEX AGENT TEAM</text>
  <text x="1140" y="44" text-anchor="end" font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei UI, sans-serif" font-size="28" font-weight="500" fill="#666661">Codex Plugin · 原生 Subagent</text>

  <g id="hero-message">
    <text x="60" y="166" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei UI, Inter, sans-serif" font-size="54" font-weight="300" fill="#0a0a0a">主会话负责整个任务</text>
    <text x="60" y="230" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei UI, Inter, sans-serif" font-size="42" font-weight="400" fill="#0a0a0a">需要时，再把局部工作交给专业子代理。</text>
    <text x="60" y="286" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei UI, Inter, sans-serif" font-size="30" font-weight="500" fill="#666661">范围、风险和最终验收留在当前会话。</text>
  </g>

  <g id="hero-hierarchy" transform="translate(760 112)">
    <rect x="0" y="0" width="360" height="112" fill="#002FA7"/>
    <text x="28" y="46" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei UI, sans-serif" font-size="28" font-weight="600" fill="#dfe6ff">完整任务</text>
    <text x="28" y="88" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei UI, sans-serif" font-size="36" font-weight="600" fill="#ffffff">主会话</text>

    <line x1="180" y1="112" x2="180" y2="150" stroke="#0a0a0a" stroke-width="2"/>
    <line x1="40" y1="150" x2="320" y2="150" stroke="#0a0a0a" stroke-width="2"/>
    <line x1="40" y1="150" x2="40" y2="176" stroke="#0a0a0a" stroke-width="2"/>
    <line x1="180" y1="150" x2="180" y2="176" stroke="#0a0a0a" stroke-width="2"/>
    <line x1="320" y1="150" x2="320" y2="176" stroke="#0a0a0a" stroke-width="2"/>

    <rect x="0" y="176" width="112" height="82" fill="#ffffff" stroke="#002FA7" stroke-width="2"/>
    <rect x="124" y="176" width="112" height="82" fill="#ffffff" stroke="#002FA7" stroke-width="2"/>
    <rect x="248" y="176" width="112" height="82" fill="#ffffff" stroke="#002FA7" stroke-width="2"/>
    <text x="56" y="214" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="600" fill="#002FA7">LUNA</text>
    <text x="56" y="244" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei UI, sans-serif" font-size="28" font-weight="500" fill="#0a0a0a">执行</text>
    <text x="180" y="214" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="600" fill="#002FA7">TERRA</text>
    <text x="180" y="244" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei UI, sans-serif" font-size="28" font-weight="500" fill="#0a0a0a">复核</text>
    <text x="304" y="214" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="600" fill="#002FA7">SOL</text>
    <text x="304" y="244" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei UI, sans-serif" font-size="28" font-weight="500" fill="#0a0a0a">裁决</text>

    <text x="180" y="310" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei UI, sans-serif" font-size="28" font-weight="600" fill="#0a0a0a">按条件出现 · 结果回到主会话</text>
  </g>

  <rect x="60" y="354" width="610" height="58" fill="#002FA7"/>
  <text x="86" y="392" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei UI, sans-serif" font-size="28" font-weight="600" fill="#ffffff">小而明确的任务，由主会话直接完成。</text>
</svg>