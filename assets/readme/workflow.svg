<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Codex Agent Team workflow</title>
  <desc id="desc">Swiss-style workflow. The main session decides whether delegation helps, Luna executes, Terra reviews only when risk warrants it, and the result returns to the main session for acceptance. Sol is reserved for consent-gated unresolved high-consequence judgment.</desc>
  <rect width="1200" height="620" fill="#ffffff"/>

  <g stroke="#0a0a0a" stroke-width="1" opacity="0.055">
    <line x1="60" y1="0" x2="60" y2="620"/>
    <line x1="195" y1="0" x2="195" y2="620"/>
    <line x1="330" y1="0" x2="330" y2="620"/>
    <line x1="465" y1="0" x2="465" y2="620"/>
    <line x1="600" y1="0" x2="600" y2="620"/>
    <line x1="735" y1="0" x2="735" y2="620"/>
    <line x1="870" y1="0" x2="870" y2="620"/>
    <line x1="1005" y1="0" x2="1005" y2="620"/>
    <line x1="1140" y1="0" x2="1140" y2="620"/>
  </g>

  <line x1="60" y1="72" x2="1140" y2="72" stroke="#0a0a0a" stroke-width="1"/>
  <text x="60" y="44" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#0a0a0a">WORKFLOW</text>
  <text x="1140" y="44" text-anchor="end" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" fill="#6d6d69">DECIDE → EXECUTE → REVIEW → ACCEPT</text>

  <text x="60" y="142" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="300" fill="#0a0a0a">Delegated work still comes back for acceptance.</text>
  <text x="60" y="182" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="500" fill="#666661">Each step has a trigger. If the trigger is absent, the step stays out.</text>

  <g transform="translate(60 232)">
    <rect x="0" y="0" width="250" height="250" fill="#002FA7"/>
    <text x="22" y="42" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" fill="#dfe6ff">01 · DECIDE</text>
    <text x="22" y="94" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="31" font-weight="300" fill="#ffffff">MAIN SESSION</text>
    <text x="22" y="142" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="500" fill="#ffffff">Is delegation useful?</text>
    <text x="22" y="182" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="400" fill="#dfe6ff">scope · risk · acceptance</text>
    <text x="22" y="222" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff">small work can stop here</text>

    <rect x="270" y="0" width="250" height="250" fill="#f2f2f0"/>
    <text x="292" y="42" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" fill="#686864">02 · EXECUTE</text>
    <text x="292" y="94" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="38" font-weight="200" fill="#0a0a0a">LUNA</text>
    <text x="292" y="142" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="500" fill="#0a0a0a">trace · implement · debug · test</text>
    <text x="292" y="182" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="400" fill="#686864">takes one bounded responsibility</text>

    <rect x="540" y="0" width="250" height="250" fill="#f2f2f0"/>
    <text x="562" y="42" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" fill="#686864">03 · REVIEW</text>
    <text x="562" y="94" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="38" font-weight="200" fill="#0a0a0a">TERRA</text>
    <text x="562" y="142" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="500" fill="#0a0a0a">detached review of risky change</text>
    <text x="562" y="182" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="400" fill="#686864">skipped without a review trigger</text>

    <rect x="810" y="0" width="270" height="250" fill="#0a0a0a"/>
    <text x="832" y="42" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" fill="#bdbdb7">04 · ACCEPT</text>
    <text x="832" y="94" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="31" font-weight="300" fill="#ffffff">MAIN SESSION</text>
    <text x="832" y="142" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="500" fill="#ffffff">inspect the actual result</text>
    <text x="832" y="182" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="400" fill="#d3d3ce">diff · tests · commands · evidence</text>
    <text x="832" y="222" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff">accept or reject</text>
  </g>

  <line x1="60" y1="526" x2="1140" y2="526" stroke="#0a0a0a" stroke-width="1"/>
  <rect x="60" y="554" width="18" height="18" fill="#002FA7"/>
  <text x="96" y="570" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a">Unresolved high-consequence judgment</text>
  <text x="450" y="570" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="500" fill="#686864">one Sol judgment only after user consent</text>
  <text x="1140" y="570" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#686864">ZERO SUBAGENTS IS VALID</text>
</svg>