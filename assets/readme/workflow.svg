<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Codex Agent Team workflow</title>
  <desc id="desc">Request enters Root, optional Luna execution and Terra review return evidence to Root, and Sol can provide a consent-gated judgment before Root makes the final decision.</desc>
  <rect width="1600" height="500" fill="#fafaf8"/>
  <text x="80" y="54" font-family="JetBrains Mono, Menlo, monospace" font-size="15" font-weight="600" letter-spacing="1.5" fill="#737373">HOW A TASK FLOWS</text>
  <line x1="80" y1="78" x2="1520" y2="78" stroke="#0a0a0a" stroke-width="1"/>

  <g font-family="Inter, Helvetica, Arial, sans-serif">
    <rect x="80" y="170" width="210" height="112" fill="#fafaf8" stroke="#0a0a0a" stroke-width="2"/>
    <text x="108" y="211" font-size="16" font-weight="600" letter-spacing="1.5" fill="#737373">01</text>
    <text x="108" y="252" font-size="25" font-weight="400" fill="#0a0a0a">Request</text>

    <rect x="390" y="150" width="230" height="152" fill="#0a0a0a"/>
    <text x="420" y="194" font-size="16" font-weight="600" letter-spacing="1.5" fill="#fafaf8">02 / ROOT</text>
    <text x="420" y="238" font-size="26" font-weight="400" fill="#fafaf8">Decide whether</text>
    <text x="420" y="270" font-size="26" font-weight="400" fill="#fafaf8">delegation helps</text>

    <rect x="740" y="118" width="230" height="112" fill="#002FA7"/>
    <text x="768" y="160" font-size="16" font-weight="600" letter-spacing="1.5" fill="#ffffff">03A / LUNA</text>
    <text x="768" y="199" font-size="23" font-weight="400" fill="#ffffff">Execute / explore</text>

    <rect x="740" y="260" width="230" height="112" fill="#fafaf8" stroke="#0a0a0a" stroke-width="2"/>
    <text x="768" y="302" font-size="16" font-weight="600" letter-spacing="1.5" fill="#737373">03B / TERRA</text>
    <text x="768" y="341" font-size="23" font-weight="400" fill="#0a0a0a">Independent review</text>

    <rect x="1090" y="150" width="230" height="152" fill="#0a0a0a"/>
    <text x="1120" y="194" font-size="16" font-weight="600" letter-spacing="1.5" fill="#fafaf8">04 / ROOT</text>
    <text x="1120" y="238" font-size="26" font-weight="400" fill="#fafaf8">Verify evidence</text>
    <text x="1120" y="270" font-size="26" font-weight="400" fill="#fafaf8">and decide</text>

    <rect x="1380" y="338" width="140" height="78" fill="#fafaf8" stroke="#0a0a0a" stroke-width="2"/>
    <text x="1404" y="369" font-size="14" font-weight="600" letter-spacing="1.2" fill="#737373">SOL</text>
    <text x="1404" y="397" font-size="16" font-weight="500" fill="#0a0a0a">with consent</text>

    <text x="1382" y="176" font-size="14" font-weight="600" letter-spacing="1.2" fill="#002FA7">DELIVER</text>
  </g>

  <g fill="none" stroke="#0a0a0a" stroke-width="2">
    <path d="M290 226 H390"/>
    <path d="M620 226 H680 V174 H740"/>
    <path d="M680 226 V316 H740"/>
    <path d="M970 174 H1030 V226 H1090"/>
    <path d="M970 316 H1030 V226"/>
    <path d="M1320 210 H1460"/>
    <path d="M1320 248 H1450 V338" stroke-dasharray="8 8"/>
    <path d="M1380 377 H1348 V292 H1320" stroke-dasharray="8 8"/>
  </g>
  <g fill="#0a0a0a">
    <path d="M382 220 l12 6 -12 6z"/>
    <path d="M732 168 l12 6 -12 6z"/>
    <path d="M732 310 l12 6 -12 6z"/>
    <path d="M1082 220 l12 6 -12 6z"/>
    <path d="M1452 204 l12 6 -12 6z"/>
    <path d="M1328 286 l-12 6 12 6z"/>
  </g>
  <text x="80" y="444" font-family="JetBrains Mono, Menlo, monospace" font-size="14" font-weight="600" letter-spacing="1.1" fill="#737373">NO BENEFIT → ROOT ONLY · UNPROVABLE ROUTE → ROOT · HIGH IMPACT → ROOT + CONSENT</text>
</svg>