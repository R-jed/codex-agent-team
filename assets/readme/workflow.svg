<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Codex Agent Team workflow</title>
  <desc id="desc">Root decides whether delegation helps, Luna executes, Terra reviews when useful, Root verifies evidence and delivers, while Sol remains an optional consent-gated consultation loop.</desc>
  <rect width="1200" height="600" fill="#0a0a0a"/>
  <line x1="60" y1="78" x2="1140" y2="78" stroke="#737373" stroke-width="1"/>

  <g font-family="Inter, Helvetica Neue, Arial, sans-serif">
    <text x="60" y="50" font-size="22" font-weight="600" letter-spacing="1.3" fill="#d4d4d2">TASK FLOW · ROOT OWNS THE FINAL DECISION</text>

    <text x="60" y="122" font-size="20" font-weight="600" letter-spacing="1" fill="#737373">01 · DECIDE</text>
    <rect x="60" y="144" width="270" height="264" fill="#fafaf8"/>
    <text x="88" y="194" font-size="21" font-weight="600" fill="#737373">ROOT</text>
    <text x="88" y="270" font-size="38" font-weight="300" fill="#0a0a0a">DELEGATE?</text>
    <text x="88" y="316" font-size="21" font-weight="500" fill="#737373">Only when it adds real value.</text>
    <line x1="88" y1="340" x2="302" y2="340" stroke="#d4d4d2" stroke-width="1"/>
    <text x="88" y="378" font-size="20" font-weight="600" fill="#737373">NO BENEFIT → ROOT</text>

    <text x="390" y="122" font-size="20" font-weight="600" letter-spacing="1" fill="#737373">02 · OPTIONAL TEAM</text>
    <rect x="390" y="144" width="360" height="126" fill="#002FA7"/>
    <text x="420" y="190" font-size="22" font-weight="600" fill="#ffffff">LUNA</text>
    <text x="420" y="234" font-size="30" font-weight="400" fill="#ffffff">Execute / explore</text>

    <rect x="390" y="294" width="360" height="114" fill="#0a0a0a" stroke="#fafaf8" stroke-width="1.5"/>
    <text x="420" y="338" font-size="22" font-weight="600" fill="#d4d4d2">TERRA</text>
    <text x="420" y="380" font-size="28" font-weight="400" fill="#fafaf8">Independent review</text>

    <text x="810" y="122" font-size="20" font-weight="600" letter-spacing="1" fill="#737373">03 · ROOT VERIFY</text>
    <rect x="810" y="144" width="270" height="264" fill="#fafaf8"/>
    <text x="838" y="194" font-size="21" font-weight="600" fill="#737373">ROOT</text>
    <text x="838" y="252" font-size="34" font-weight="300" fill="#0a0a0a">VERIFY</text>
    <text x="838" y="300" font-size="34" font-weight="300" fill="#0a0a0a">RESOLVE</text>
    <text x="838" y="348" font-size="34" font-weight="300" fill="#0a0a0a">DECIDE</text>
    <text x="838" y="382" font-size="20" font-weight="600" fill="#737373">ROOT DELIVERS</text>

    <rect x="810" y="452" width="270" height="88" fill="#0a0a0a" stroke="#737373" stroke-width="1.5"/>
    <text x="838" y="486" font-size="20" font-weight="600" fill="#737373">OPTIONAL · WITH CONSENT</text>
    <text x="838" y="520" font-size="25" font-weight="400" fill="#fafaf8">SOL · senior judgment</text>

    <text x="1102" y="290" font-size="22" font-weight="600" fill="#fafaf8">DELIVER</text>
    <text x="60" y="568" font-size="20" font-weight="600" fill="#737373">NO BENEFIT → ROOT · UNPROVABLE ROUTE → ROOT · HIGH IMPACT → ROOT + CONSENT</text>
  </g>

  <g fill="none" stroke="#fafaf8" stroke-width="2">
    <path d="M330 276 H360 V207 H390"/>
    <path d="M360 276 V351 H390"/>
    <path d="M750 207 H780 V276 H810"/>
    <path d="M750 351 H780 V276"/>
    <path d="M1080 276 H1140"/>
  </g>
  <g fill="none" stroke="#737373" stroke-width="1.5" stroke-dasharray="8 8">
    <path d="M945 408 V452"/>
    <path d="M810 496 H778 V382 H810"/>
  </g>
  <g fill="#fafaf8">
    <path d="M382 201 l12 6 -12 6z"/>
    <path d="M382 345 l12 6 -12 6z"/>
    <path d="M802 270 l12 6 -12 6z"/>
    <path d="M1132 270 l12 6 -12 6z"/>
  </g>
</svg>