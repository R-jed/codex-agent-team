<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Codex Agent Team 角色层级</title>
  <desc id="desc">当前会话是控制平面。Luna 是主要执行路线，Terra 是独立复核，Sol 是经授权的少量高级裁决。</desc>
  <rect width="1200" height="620" fill="#fafaf8"/>
  <line x1="60" y1="78" x2="1140" y2="78" stroke="#d4d4d2" stroke-width="1"/>

  <g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="60" y="50" font-size="22" font-weight="600" fill="#737373">角色层级 · 控制权集中，执行按需委派</text>

    <rect x="60" y="118" width="330" height="428" fill="#0a0a0a"/>
    <text x="90" y="166" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#d4d4d2">ROOT</text>
    <text x="90" y="236" font-size="54" font-weight="200" fill="#fafaf8">主控</text>
    <text x="90" y="294" font-size="26" font-weight="400" fill="#fafaf8">规划任务</text>
    <text x="90" y="334" font-size="26" font-weight="400" fill="#fafaf8">控制风险与范围</text>
    <text x="90" y="374" font-size="26" font-weight="400" fill="#fafaf8">验证证据</text>
    <text x="90" y="414" font-size="26" font-weight="400" fill="#fafaf8">负责最终回答</text>
    <line x1="90" y1="456" x2="360" y2="456" stroke="#737373" stroke-width="1"/>
    <text x="90" y="496" font-size="20" font-weight="600" fill="#737373">技能不会暗中替换当前会话</text>

    <rect x="420" y="118" width="720" height="180" fill="#002FA7"/>
    <text x="450" y="176" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="200" fill="#ffffff">LUNA</text>
    <text x="450" y="224" font-size="28" font-weight="500" fill="#ffffff">主要执行路线</text>
    <text x="790" y="176" font-size="22" font-weight="600" fill="#ffffff">GPT-5.6 · max</text>
    <text x="790" y="224" font-size="22" font-weight="500" fill="#ffffff">搜索 · 实现 · 调试 · 测试</text>
    <text x="450" y="270" font-size="20" font-weight="600" fill="#ffffff">任务边界清楚时，负责重执行与探索</text>

    <rect x="420" y="322" width="720" height="132" fill="#fafaf8" stroke="#0a0a0a" stroke-width="1.5"/>
    <text x="450" y="372" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="38" font-weight="200" fill="#0a0a0a">TERRA</text>
    <text x="450" y="416" font-size="26" font-weight="500" fill="#0a0a0a">独立复核</text>
    <text x="790" y="372" font-size="21" font-weight="600" fill="#737373">GPT-5.6 · xhigh</text>
    <text x="790" y="416" font-size="21" font-weight="500" fill="#737373">冲突证据 · 关键假设</text>

    <rect x="420" y="478" width="720" height="68" fill="#f0f0ee"/>
    <text x="450" y="521" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="300" fill="#0a0a0a">SOL</text>
    <text x="560" y="521" font-size="22" font-weight="500" fill="#0a0a0a">高级裁决</text>
    <text x="790" y="521" font-size="20" font-weight="600" fill="#737373">GPT-5.6 · high · 需明确授权</text>
  </g>
</svg>