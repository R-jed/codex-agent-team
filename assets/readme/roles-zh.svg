<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Codex Agent Team 角色分工</title>
  <desc id="desc">Root 是控制平面，Luna、Terra 和 Sol 是按需委派的角色，承担不同职责与不同级别的升级。</desc>
  <rect width="1600" height="620" fill="#fafaf8"/>
  <text x="80" y="64" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="600" fill="#737373">控制平面 + 委派角色</text>
  <line x1="80" y1="96" x2="1520" y2="96" stroke="#d4d4d2" stroke-width="1"/>

  <g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <rect x="80" y="144" width="439" height="396" fill="#0a0a0a"/>
    <text x="112" y="198" font-size="26" font-weight="600" fill="#d4d4d2">ROOT · 当前会话</text>
    <text x="112" y="274" font-size="60" font-weight="200" fill="#fafaf8">主控</text>
    <text x="112" y="330" font-size="28" font-weight="400" fill="#fafaf8">规划任务</text>
    <text x="112" y="370" font-size="28" font-weight="400" fill="#fafaf8">控制风险与范围</text>
    <text x="112" y="410" font-size="28" font-weight="400" fill="#fafaf8">验证证据</text>
    <text x="112" y="450" font-size="28" font-weight="400" fill="#fafaf8">负责最终回答</text>
    <text x="112" y="510" font-size="22" font-weight="500" fill="#737373">Skill 不会暗中替换 Root</text>

    <rect x="626" y="144" width="894" height="120" fill="#002FA7"/>
    <text x="658" y="194" font-family="Inter, Helvetica, Arial, sans-serif" font-size="46" font-weight="200" fill="#ffffff">LUNA</text>
    <text x="900" y="190" font-size="28" font-weight="500" fill="#ffffff">执行 / 探索</text>
    <text x="1320" y="190" font-size="22" font-weight="600" fill="#ffffff">GPT-5.6 / max</text>
    <text x="900" y="232" font-size="22" font-weight="500" fill="#ffffff">搜索 · 实现 · 调试 · 测试</text>

    <rect x="626" y="288" width="894" height="120" fill="#fafaf8" stroke="#0a0a0a" stroke-width="2"/>
    <text x="658" y="338" font-family="Inter, Helvetica, Arial, sans-serif" font-size="46" font-weight="200" fill="#0a0a0a">TERRA</text>
    <text x="900" y="334" font-size="28" font-weight="500" fill="#0a0a0a">独立复核</text>
    <text x="1320" y="334" font-size="22" font-weight="600" fill="#737373">GPT-5.6 / xhigh</text>
    <text x="900" y="376" font-size="22" font-weight="500" fill="#737373">脱离实现路径检查 · 冲突证据 · 关键假设</text>

    <rect x="626" y="432" width="894" height="108" fill="#f0f0ee"/>
    <text x="658" y="480" font-family="Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="200" fill="#0a0a0a">SOL</text>
    <text x="900" y="476" font-size="28" font-weight="500" fill="#0a0a0a">高级裁决</text>
    <text x="1320" y="476" font-size="22" font-weight="600" fill="#737373">GPT-5.6 / high</text>
    <text x="900" y="516" font-size="22" font-weight="500" fill="#737373">少量高后果问题 · 需要用户明确授权</text>
  </g>
</svg>