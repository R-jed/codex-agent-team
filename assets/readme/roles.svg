<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Codex Agent Team roles</title>
  <desc id="desc">Editorial role ledger. The main session owns scope, risk, and acceptance; Luna executes, Terra performs detached review, and Sol handles rare unresolved high-consequence judgment after user consent.</desc>
  <rect width="1200" height="700" fill="#17251f"/>

  <g fill="none" stroke="#f2ede3" stroke-width="1" opacity="0.075">
    <path d="M-70 176 C52 92 176 108 250 184 C316 252 304 336 234 384 C162 432 70 404 -18 486"/>
    <path d="M-32 212 C72 144 168 150 228 210 C278 260 268 324 210 360 C152 398 88 378 18 444"/>
    <path d="M900 44 C988 14 1098 44 1150 116 C1190 172 1168 230 1112 264 C1048 304 1000 282 956 330 C920 370 940 426 1004 462"/>
  </g>

  <line x1="58" y1="72" x2="1142" y2="72" stroke="#f2ede3" stroke-width="1" opacity="0.45"/>
  <text x="58" y="44" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#d8d1c5">ROLE LEDGER</text>
  <text x="1142" y="44" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#9ea89f">MAKE OWNERSHIP EXPLICIT</text>

  <text x="58" y="142" font-family="Playfair Display, Georgia, Times New Roman, serif" font-size="46" font-weight="500" fill="#f2ede3">Four roles. Four responsibilities.</text>
  <text x="58" y="182" font-family="Playfair Display, Georgia, Times New Roman, serif" font-size="22" font-weight="400" fill="#bac2bb">Execution can move. Final acceptance stays in the current session.</text>

  <g transform="translate(58 226)">
    <line x1="0" y1="0" x2="1084" y2="0" stroke="#f2ede3" stroke-width="1" opacity="0.42"/>
    <text x="0" y="48" font-family="Playfair Display, Georgia, Times New Roman, serif" font-size="31" font-weight="500" fill="#f2ede3">MAIN SESSION</text>
    <text x="272" y="44" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#9ea89f">CURRENT CODEX SESSION</text>
    <text x="548" y="44" font-family="Playfair Display, Georgia, Times New Roman, serif" font-size="23" font-weight="400" fill="#f2ede3">scope · risk · acceptance · final answer</text>
    <text x="1084" y="44" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#c7cfc8">ALWAYS PRESENT</text>

    <line x1="0" y1="82" x2="1084" y2="82" stroke="#f2ede3" stroke-width="1" opacity="0.24"/>
    <text x="0" y="130" font-family="Playfair Display, Georgia, Times New Roman, serif" font-size="36" font-weight="500" fill="#f2ede3">LUNA</text>
    <text x="272" y="126" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#9ea89f">GPT-5.6 LUNA · MAX</text>
    <text x="548" y="126" font-family="Playfair Display, Georgia, Times New Roman, serif" font-size="23" font-weight="400" fill="#f2ede3">search · code tracing · implement · debug · test</text>
    <text x="1084" y="126" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#c7cfc8">EXECUTE</text>

    <line x1="0" y1="164" x2="1084" y2="164" stroke="#f2ede3" stroke-width="1" opacity="0.24"/>
    <text x="0" y="212" font-family="Playfair Display, Georgia, Times New Roman, serif" font-size="36" font-weight="500" fill="#f2ede3">TERRA</text>
    <text x="272" y="208" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#9ea89f">GPT-5.6 TERRA · XHIGH</text>
    <text x="548" y="208" font-family="Playfair Display, Georgia, Times New Roman, serif" font-size="23" font-weight="400" fill="#f2ede3">risky changes · conflicting evidence · key assumptions</text>
    <text x="1084" y="208" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#c7cfc8">DETACHED REVIEW</text>

    <line x1="0" y1="246" x2="1084" y2="246" stroke="#f2ede3" stroke-width="1" opacity="0.24"/>
    <text x="0" y="294" font-family="Playfair Display, Georgia, Times New Roman, serif" font-size="36" font-weight="500" fill="#f2ede3">SOL</text>
    <text x="272" y="290" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#9ea89f">GPT-5.6 SOL · HIGH</text>
    <text x="548" y="290" font-family="Playfair Display, Georgia, Times New Roman, serif" font-size="23" font-weight="400" fill="#f2ede3">one judgment when high-consequence disagreement remains</text>
    <text x="1084" y="290" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#c7cfc8">CONSENT FIRST</text>
    <line x1="0" y1="328" x2="1084" y2="328" stroke="#f2ede3" stroke-width="1" opacity="0.42"/>
  </g>

  <text x="58" y="612" font-family="Playfair Display, Georgia, Times New Roman, serif" font-size="23" font-weight="400" fill="#f2ede3">Subagents own only the bounded work they receive, and they do not create another team below them.</text>
  <text x="58" y="650" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#9ea89f">DEPTH 1 · ONE ACTIVE WRITING WORKER PER SHARED WORKSPACE</text>
  <text x="1142" y="650" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#9ea89f">03 / ROLES</text>
</svg>