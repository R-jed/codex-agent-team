<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Codex Agent Team roles</title>
  <desc id="desc">Root is the control plane. Luna, Terra, and Sol are delegated roles with different responsibilities and escalation weight.</desc>
  <rect width="1600" height="620" fill="#fafaf8"/>
  <text x="80" y="64" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="1.8" fill="#737373">CONTROL PLANE + DELEGATED ROLES</text>
  <line x1="80" y1="96" x2="1520" y2="96" stroke="#d4d4d2" stroke-width="1"/>

  <g font-family="Inter, Helvetica, Arial, sans-serif">
    <rect x="80" y="144" width="439" height="396" fill="#0a0a0a"/>
    <text x="112" y="198" font-size="26" font-weight="600" fill="#d4d4d2">ROOT · CURRENT SESSION</text>
    <text x="112" y="274" font-size="60" font-weight="200" letter-spacing="-2" fill="#fafaf8">CONTROL</text>
    <text x="112" y="330" font-size="28" font-weight="400" fill="#fafaf8">Plan the work</text>
    <text x="112" y="370" font-size="28" font-weight="400" fill="#fafaf8">Own risk and scope</text>
    <text x="112" y="410" font-size="28" font-weight="400" fill="#fafaf8">Verify evidence</text>
    <text x="112" y="450" font-size="28" font-weight="400" fill="#fafaf8">Deliver the final answer</text>
    <text x="112" y="510" font-size="22" font-weight="500" fill="#737373">Never silently replaced by the Skill</text>

    <rect x="626" y="144" width="894" height="120" fill="#002FA7"/>
    <text x="658" y="194" font-size="46" font-weight="200" fill="#ffffff">LUNA</text>
    <text x="900" y="190" font-size="28" font-weight="500" fill="#ffffff">Execution / exploration</text>
    <text x="1320" y="190" font-size="22" font-weight="600" fill="#ffffff">GPT-5.6 / max</text>
    <text x="900" y="232" font-size="22" font-weight="500" fill="#ffffff">Search · implement · debug · test</text>

    <rect x="626" y="288" width="894" height="120" fill="#fafaf8" stroke="#0a0a0a" stroke-width="2"/>
    <text x="658" y="338" font-size="46" font-weight="200" fill="#0a0a0a">TERRA</text>
    <text x="900" y="334" font-size="28" font-weight="500" fill="#0a0a0a">Independent review</text>
    <text x="1320" y="334" font-size="22" font-weight="600" fill="#737373">GPT-5.6 / xhigh</text>
    <text x="900" y="376" font-size="22" font-weight="500" fill="#737373">Detached review · conflicting evidence · assumption checks</text>

    <rect x="626" y="432" width="894" height="108" fill="#f0f0ee"/>
    <text x="658" y="480" font-size="42" font-weight="200" fill="#0a0a0a">SOL</text>
    <text x="900" y="476" font-size="28" font-weight="500" fill="#0a0a0a">Senior judgment</text>
    <text x="1320" y="476" font-size="22" font-weight="600" fill="#737373">GPT-5.6 / high</text>
    <text x="900" y="516" font-size="22" font-weight="500" fill="#737373">Rare · high consequence · explicit user consent</text>
  </g>
</svg>