<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Codex Agent Team role hierarchy</title>
  <desc id="desc">Root is the control plane. Luna is the primary execution route, Terra provides independent review, and Sol is reserved for rare consent-gated senior judgment.</desc>
  <rect width="1200" height="620" fill="#fafaf8"/>
  <line x1="60" y1="78" x2="1140" y2="78" stroke="#d4d4d2" stroke-width="1"/>

  <g font-family="Inter, Helvetica Neue, Arial, sans-serif">
    <text x="60" y="50" font-size="22" font-weight="600" letter-spacing="1.2" fill="#737373">ROLE HIERARCHY · CENTRAL CONTROL, BOUNDED DELEGATION</text>

    <rect x="60" y="118" width="330" height="428" fill="#0a0a0a"/>
    <text x="90" y="166" font-size="22" font-weight="600" fill="#d4d4d2">ROOT · CURRENT SESSION</text>
    <text x="90" y="236" font-size="54" font-weight="200" letter-spacing="-2" fill="#fafaf8">CONTROL</text>
    <text x="90" y="294" font-size="26" font-weight="400" fill="#fafaf8">Plan the work</text>
    <text x="90" y="334" font-size="26" font-weight="400" fill="#fafaf8">Own risk and scope</text>
    <text x="90" y="374" font-size="26" font-weight="400" fill="#fafaf8">Verify evidence</text>
    <text x="90" y="414" font-size="26" font-weight="400" fill="#fafaf8">Deliver the final answer</text>
    <line x1="90" y1="456" x2="360" y2="456" stroke="#737373" stroke-width="1"/>
    <text x="90" y="496" font-size="20" font-weight="600" fill="#737373">Root never changes silently</text>

    <rect x="420" y="118" width="720" height="180" fill="#002FA7"/>
    <text x="450" y="176" font-size="44" font-weight="200" fill="#ffffff">LUNA</text>
    <text x="450" y="224" font-size="28" font-weight="500" fill="#ffffff">Primary execution route</text>
    <text x="790" y="176" font-size="22" font-weight="600" fill="#ffffff">GPT-5.6 · max</text>
    <text x="790" y="224" font-size="22" font-weight="500" fill="#ffffff">Search · implement · debug · test</text>
    <text x="450" y="270" font-size="20" font-weight="600" fill="#ffffff">Heavy execution and exploration inside a bounded task</text>

    <rect x="420" y="322" width="720" height="132" fill="#fafaf8" stroke="#0a0a0a" stroke-width="1.5"/>
    <text x="450" y="372" font-size="38" font-weight="200" fill="#0a0a0a">TERRA</text>
    <text x="450" y="416" font-size="26" font-weight="500" fill="#0a0a0a">Independent review</text>
    <text x="790" y="372" font-size="21" font-weight="600" fill="#737373">GPT-5.6 · xhigh</text>
    <text x="790" y="416" font-size="21" font-weight="500" fill="#737373">Conflicts · assumptions</text>

    <rect x="420" y="478" width="720" height="68" fill="#f0f0ee"/>
    <text x="450" y="521" font-size="30" font-weight="300" fill="#0a0a0a">SOL</text>
    <text x="560" y="521" font-size="22" font-weight="500" fill="#0a0a0a">Senior judgment</text>
    <text x="790" y="521" font-size="20" font-weight="600" fill="#737373">GPT-5.6 · high · consent required</text>
  </g>
</svg>