<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Codex Agent Team role hierarchy</title>
  <desc id="desc">Editorial e-ink role hierarchy. Root is the control layer, Luna is the primary execution route, Terra provides detached review, and Sol is reserved for rare consent-gated senior judgment.</desc>
  <rect width="1200" height="660" fill="#0a1f3d"/>

  <g fill="none" stroke="#f1f3f5" stroke-width="1.1" opacity="0.1">
    <path d="M-50 196 C70 92 218 104 302 202 C358 270 344 364 270 414 C184 472 70 426 -18 526"/>
    <path d="M-16 226 C84 140 208 148 276 228 C322 282 310 350 248 392 C178 438 88 406 12 486"/>
    <path d="M24 258 C106 188 198 194 254 254 C288 294 282 340 232 374 C174 412 110 388 44 450"/>
  </g>

  <line x1="56" y1="72" x2="1144" y2="72" stroke="#f1f3f5" stroke-width="1" opacity="0.34"/>
  <line x1="56" y1="596" x2="1144" y2="596" stroke="#f1f3f5" stroke-width="1" opacity="0.34"/>

  <text x="56" y="46" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" letter-spacing="1.3" fill="#f1f3f5" opacity="0.68">ACT III · ROLE MAP</text>
  <text x="1144" y="46" text-anchor="end" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" letter-spacing="1.1" fill="#f1f3f5" opacity="0.68">CENTRAL CONTROL · BOUNDED DELEGATION · 03 / 03</text>

  <text x="56" y="132" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#f1f3f5" opacity="0.6">ACTIVE SESSION</text>
  <text x="52" y="242" font-family="Playfair Display, Georgia, Times New Roman, serif" font-size="86" font-weight="700" letter-spacing="-2" fill="#f1f3f5">ROOT</text>
  <text x="56" y="292" font-family="Playfair Display, Georgia, Times New Roman, serif" font-size="34" font-weight="700" fill="#f1f3f5">Control layer</text>

  <text x="56" y="354" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="400" fill="#f1f3f5">Plan the work</text>
  <text x="56" y="392" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="400" fill="#f1f3f5">Own risk and scope</text>
  <text x="56" y="430" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="400" fill="#f1f3f5">Verify evidence</text>
  <text x="56" y="468" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="400" fill="#f1f3f5">Deliver the final answer</text>

  <line x1="436" y1="114" x2="436" y2="552" stroke="#f1f3f5" stroke-width="1" opacity="0.26"/>

  <rect x="478" y="116" width="666" height="154" fill="#f1f3f5"/>
  <text x="510" y="168" font-family="Playfair Display, Georgia, Times New Roman, serif" font-size="50" font-weight="700" fill="#0a1f3d">LUNA</text>
  <text x="510" y="214" font-family="Playfair Display, Georgia, Times New Roman, serif" font-size="28" font-weight="700" fill="#0a1f3d">Primary execution route</text>
  <text x="818" y="168" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" fill="#0a1f3d" opacity="0.66">GPT-5.6 · MAX</text>
  <text x="818" y="214" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="500" fill="#0a1f3d">Search · implement · debug · test</text>
  <text x="510" y="250" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="500" fill="#0a1f3d" opacity="0.68">Heavy execution and exploration inside a bounded task.</text>

  <line x1="478" y1="308" x2="1144" y2="308" stroke="#f1f3f5" stroke-width="1" opacity="0.32"/>
  <text x="478" y="364" font-family="Playfair Display, Georgia, Times New Roman, serif" font-size="44" font-weight="700" fill="#f1f3f5">TERRA</text>
  <text x="478" y="408" font-family="Playfair Display, Georgia, Times New Roman, serif" font-size="27" font-weight="700" fill="#f1f3f5">Independent review</text>
  <text x="818" y="358" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" fill="#f1f3f5" opacity="0.62">GPT-5.6 · XHIGH</text>
  <text x="818" y="402" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="500" fill="#f1f3f5" opacity="0.78">Conflicting evidence · assumptions</text>
  <text x="818" y="430" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="500" fill="#f1f3f5" opacity="0.78">Detached verification</text>

  <line x1="478" y1="448" x2="1144" y2="448" stroke="#f1f3f5" stroke-width="1" opacity="0.32"/>
  <text x="478" y="504" font-family="Playfair Display, Georgia, Times New Roman, serif" font-size="40" font-weight="700" fill="#f1f3f5">SOL</text>
  <text x="478" y="544" font-family="Playfair Display, Georgia, Times New Roman, serif" font-size="25" font-weight="700" fill="#f1f3f5">Consent-gated judgment</text>
  <text x="818" y="498" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" fill="#f1f3f5" opacity="0.62">GPT-5.6 · HIGH</text>
  <text x="818" y="540" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="500" fill="#f1f3f5" opacity="0.78">Rare high-consequence decisions</text>
  <text x="818" y="568" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="500" fill="#f1f3f5" opacity="0.78">Explicit user consent required</text>

  <text x="56" y="634" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="500" fill="#f1f3f5" opacity="0.68">The Skill never silently switches the active Root model or reasoning effort.</text>
  <text x="1144" y="634" text-anchor="end" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" letter-spacing="1" fill="#f1f3f5" opacity="0.58">BOUNDED DELEGATION</text>
</svg>