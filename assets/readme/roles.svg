<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Codex Agent Team roles</title>
  <desc id="desc">Four-column role map for Root, Luna, Terra, and Sol.</desc>
  <rect width="1600" height="520" fill="#fafaf8"/>
  <text x="80" y="54" font-family="JetBrains Mono, Menlo, monospace" font-size="15" font-weight="600" letter-spacing="1.5" fill="#737373">ROLE MAP / FIXED RESPONSIBILITIES</text>
  <line x1="80" y1="78" x2="1520" y2="78" stroke="#0a0a0a" stroke-width="1"/>
  <g stroke="#d4d4d2" stroke-width="1">
    <line x1="440" y1="78" x2="440" y2="458"/>
    <line x1="800" y1="78" x2="800" y2="458"/>
    <line x1="1160" y1="78" x2="1160" y2="458"/>
  </g>
  <g font-family="Inter, Helvetica, Arial, sans-serif">
    <rect x="80" y="112" width="12" height="12" fill="#0a0a0a"/>
    <text x="80" y="210" font-size="58" font-weight="200" letter-spacing="-2" fill="#0a0a0a">ROOT</text>
    <text x="80" y="250" font-size="20" font-weight="500" fill="#0a0a0a">Control</text>
    <text x="80" y="300" font-size="17" fill="#737373">Plan · decide · integrate</text>
    <text x="80" y="330" font-size="17" fill="#737373">Final answer</text>

    <rect x="480" y="112" width="12" height="12" fill="#002FA7"/>
    <text x="480" y="210" font-size="58" font-weight="200" letter-spacing="-2" fill="#002FA7">LUNA</text>
    <text x="480" y="250" font-size="20" font-weight="500" fill="#0a0a0a">Explorer / Worker</text>
    <text x="480" y="300" font-size="17" fill="#737373">Search · implement · test</text>
    <text x="480" y="330" font-size="17" fill="#737373">GPT-5.6 Luna / max</text>

    <rect x="840" y="112" width="12" height="12" fill="#0a0a0a"/>
    <text x="840" y="210" font-size="58" font-weight="200" letter-spacing="-2" fill="#0a0a0a">TERRA</text>
    <text x="840" y="250" font-size="20" font-weight="500" fill="#0a0a0a">Independent Critic</text>
    <text x="840" y="300" font-size="17" fill="#737373">Detached review</text>
    <text x="840" y="330" font-size="17" fill="#737373">GPT-5.6 Terra / xhigh</text>

    <rect x="1200" y="112" width="12" height="12" fill="#0a0a0a"/>
    <text x="1200" y="210" font-size="58" font-weight="200" letter-spacing="-2" fill="#0a0a0a">SOL</text>
    <text x="1200" y="250" font-size="20" font-weight="500" fill="#0a0a0a">Senior Judge</text>
    <text x="1200" y="300" font-size="17" fill="#737373">High-consequence review</text>
    <text x="1200" y="330" font-size="17" fill="#737373">Consent required</text>
  </g>
  <rect x="80" y="458" width="1440" height="7" fill="#002FA7"/>
</svg>