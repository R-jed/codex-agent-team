<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" fill="none" font-family="Inter, Helvetica, 'Noto Sans SC', sans-serif">
  <rect width="720" height="520" fill="#fafafa"/>

  <!-- Main Session -->
  <rect x="200" y="32" width="320" height="72" rx="0" fill="#1a1a1a"/>
  <text x="360" y="60" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">Main Session</text>
  <text x="360" y="80" text-anchor="middle" fill="#999" font-size="11">understand · decide · schedule · accept</text>

  <!-- Arrows from main -->
  <line x1="280" y1="104" x2="160" y2="168" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="360" y1="104" x2="360" y2="168" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="440" y1="104" x2="560" y2="168" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Luna -->
  <rect x="48" y="168" width="224" height="120" rx="0" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="48" y="168" width="224" height="32" rx="0" fill="#2563eb"/>
  <text x="160" y="189" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Luna · Execution</text>
  <text x="64" y="222" fill="#1a1a1a" font-size="12" font-weight="500">Reader</text>
  <text x="64" y="238" fill="#666" font-size="11">search · tracing · test mapping · evidence</text>
  <line x1="64" y1="248" x2="256" y2="248" stroke="#e5e5e5" stroke-width="0.5"/>
  <text x="64" y="264" fill="#1a1a1a" font-size="12" font-weight="500">Worker</text>
  <text x="64" y="280" fill="#666" font-size="11">implement · debug · test · refactor</text>

  <!-- Terra -->
  <rect x="248" y="168" width="224" height="120" rx="0" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="248" y="168" width="224" height="32" rx="0" fill="#d97706"/>
  <text x="360" y="189" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Terra · Deep Investigation</text>
  <text x="264" y="222" fill="#1a1a1a" font-size="12" font-weight="500">Investigator</text>
  <text x="264" y="238" fill="#666" font-size="11">unresolved complex technical delta</text>
  <text x="264" y="264" fill="#999" font-size="10" font-style="italic">read-only by default, no full redo</text>

  <!-- Sol -->
  <rect x="448" y="168" width="224" height="120" rx="0" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="448" y="168" width="224" height="32" rx="0" fill="#059669"/>
  <text x="560" y="189" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Sol · Judgment</text>
  <text x="464" y="222" fill="#1a1a1a" font-size="12" font-weight="500">Advisor</text>
  <text x="464" y="238" fill="#666" font-size="11">judgment · selective review</text>
  <text x="464" y="264" fill="#999" font-size="10" font-style="italic">on-demand, not a mandatory gate</text>

  <!-- Return arrows (dashed) -->
  <path d="M160,288 Q160,320 200,340 Q280,370 360,340" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M360,288 Q360,320 360,340" stroke="#d97706" stroke-width="1" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow-amber)"/>
  <path d="M560,288 Q560,320 520,340 Q440,370 360,340" stroke="#059669" stroke-width="1" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow-green)"/>

  <!-- Delegation Contract -->
  <rect x="48" y="340" width="280" height="140" rx="0" fill="#fff" stroke="#e5e5e5" stroke-width="1"/>
  <text x="64" y="364" fill="#1a1a1a" font-size="12" font-weight="600">Delegation Contract</text>
  <line x1="64" y1="372" x2="312" y2="372" stroke="#e5e5e5" stroke-width="0.5"/>
  <text x="64" y="390" fill="#666" font-size="11">OUTCOME · SCOPE · INVARIANTS</text>
  <text x="64" y="408" fill="#666" font-size="11">DECISION RIGHTS · ACCEPTANCE</text>
  <text x="64" y="426" fill="#666" font-size="11">VERIFICATION · STOP/ESCALATE</text>
  <text x="64" y="452" fill="#999" font-size="10" font-style="italic">compiled before writing tasks, skipped when acceptance is unclear</text>

  <!-- Evidence State -->
  <rect x="392" y="340" width="280" height="140" rx="0" fill="#fff" stroke="#e5e5e5" stroke-width="1"/>
  <text x="408" y="364" fill="#1a1a1a" font-size="12" font-weight="600">Shared Evidence State</text>
  <line x1="408" y1="372" x2="656" y2="372" stroke="#e5e5e5" stroke-width="0.5"/>
  <text x="408" y="390" fill="#666" font-size="11">deterministic — reusable</text>
  <text x="408" y="408" fill="#666" font-size="11">repository_fact — reusable</text>
  <text x="408" y="426" fill="#666" font-size="11">model_judgment — hypothesis, challengeable</text>
  <text x="408" y="452" fill="#999" font-size="10" font-style="italic">changed input invalidates only dependent evidence</text>

  <!-- Flow paths label -->
  <text x="360" y="504" text-anchor="middle" fill="#999" font-size="10">common paths: main → Luna → main · main → Luna → Sol → main · main → Luna → Terra(δ) → Luna → main</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-blue" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
  </defs>
</svg>
