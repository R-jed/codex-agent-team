<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 480" fill="none" font-family="Inter, Helvetica, 'Noto Sans SC', sans-serif">
  <rect width="1440" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="48" y="56" fill="#1a1a1a" font-size="26" font-weight="600">失败分类与升级路径</text>

  <!-- Failure node -->
  <rect x="48" y="104" width="280" height="88" rx="0" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="188" y="144" text-anchor="middle" fill="#dc2626" font-size="22" font-weight="600">Luna 未通过验收</text>
  <text x="188" y="176" text-anchor="middle" fill="#999" font-size="18">先分类，再升级</text>

  <!-- Four branches -->
  <line x1="328" y1="128" x2="400" y2="128" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="328" y1="148" x2="400" y2="216" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="328" y1="148" x2="400" y2="304" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="328" y1="168" x2="400" y2="392" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Mechanical -->
  <rect x="400" y="88" width="320" height="80" rx="0" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="560" y="120" text-anchor="middle" fill="#2563eb" font-size="20" font-weight="600">机械错误</text>
  <text x="560" y="152" text-anchor="middle" fill="#666" font-size="18">→ Luna 定点修正</text>

  <!-- Contract gap -->
  <rect x="400" y="176" width="320" height="80" rx="0" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="560" y="208" text-anchor="middle" fill="#d97706" font-size="20" font-weight="600">合同缺口</text>
  <text x="560" y="240" text-anchor="middle" fill="#666" font-size="18">→ 主会话补齐合同</text>

  <!-- Capability gap -->
  <rect x="400" y="264" width="320" height="80" rx="0" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="560" y="296" text-anchor="middle" fill="#d97706" font-size="20" font-weight="600">技术缺口</text>
  <text x="560" y="328" text-anchor="middle" fill="#666" font-size="18">→ Terra 只调查未解决部分</text>

  <!-- Judgment gap -->
  <rect x="400" y="352" width="320" height="80" rx="0" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="560" y="384" text-anchor="middle" fill="#059669" font-size="20" font-weight="600">判断缺口</text>
  <text x="560" y="416" text-anchor="middle" fill="#666" font-size="18">→ 主会话决定，或调用 Sol</text>

  <!-- Key principles -->
  <rect x="800" y="88" width="600" height="344" rx="0" fill="#fff" stroke="#e5e5e5" stroke-width="2"/>
  <text x="832" y="136" fill="#1a1a1a" font-size="22" font-weight="600">核心原则</text>
  <line x1="832" y1="152" x2="1368" y2="152" stroke="#e5e5e5" stroke-width="1"/>

  <text x="832" y="192" fill="#666" font-size="20">Luna 结果"看起来一般"不自动触发 Terra</text>
  <text x="832" y="224" fill="#666" font-size="20">全量重做。先分类失败原因。</text>

  <text x="832" y="272" fill="#666" font-size="20">Terra 只接收未解决的 delta，</text>
  <text x="832" y="304" fill="#666" font-size="20">不重做整个 Luna 职责。</text>

  <text x="832" y="352" fill="#666" font-size="20">Sol 不是每次必须经过的关卡。</text>
  <text x="832" y="384" fill="#666" font-size="20">测试和验收足够明确时可跳过。</text>

  <text x="832" y="424" fill="#999" font-size="18" font-style="italic">保留有效证据，仅重算失效部分。</text>
</svg>
