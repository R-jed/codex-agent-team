<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" fill="none" font-family="Inter, Helvetica, 'Noto Sans SC', sans-serif">
  <rect width="720" height="240" fill="#fafafa"/>

  <!-- Title -->
  <text x="24" y="28" fill="#1a1a1a" font-size="13" font-weight="600">失败分类与升级路径</text>

  <!-- Failure node -->
  <rect x="24" y="52" width="140" height="44" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="94" y="72" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="600">Luna 未通过验收</text>
  <text x="94" y="88" text-anchor="middle" fill="#999" font-size="9">先分类，再升级</text>

  <!-- Four branches -->
  <line x1="164" y1="64" x2="200" y2="64" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="164" y1="74" x2="200" y2="108" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="164" y1="74" x2="200" y2="152" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="164" y1="84" x2="200" y2="196" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Mechanical -->
  <rect x="200" y="44" width="160" height="40" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="280" y="60" text-anchor="middle" fill="#2563eb" font-size="10" font-weight="600">机械错误</text>
  <text x="280" y="76" text-anchor="middle" fill="#666" font-size="9">→ Luna 定点修正</text>

  <!-- Contract gap -->
  <rect x="200" y="88" width="160" height="40" rx="2" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="280" y="104" text-anchor="middle" fill="#d97706" font-size="10" font-weight="600">合同缺口</text>
  <text x="280" y="120" text-anchor="middle" fill="#666" font-size="9">→ 主会话补齐合同</text>

  <!-- Capability gap -->
  <rect x="200" y="132" width="160" height="40" rx="2" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="280" y="148" text-anchor="middle" fill="#d97706" font-size="10" font-weight="600">技术缺口</text>
  <text x="280" y="164" text-anchor="middle" fill="#666" font-size="9">→ Terra 只调查未解决部分</text>

  <!-- Judgment gap -->
  <rect x="200" y="176" width="160" height="40" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="280" y="192" text-anchor="middle" fill="#059669" font-size="10" font-weight="600">判断缺口</text>
  <text x="280" y="208" text-anchor="middle" fill="#666" font-size="9">→ 主会话决定，或调用 Sol</text>

  <!-- Key principles -->
  <rect x="400" y="44" width="300" height="172" rx="2" fill="#fff" stroke="#e5e5e5" stroke-width="1"/>
  <text x="416" y="68" fill="#1a1a1a" font-size="11" font-weight="600">核心原则</text>
  <line x1="416" y1="76" x2="684" y2="76" stroke="#e5e5e5" stroke-width="0.5"/>

  <text x="416" y="96" fill="#666" font-size="10">Luna 结果"看起来一般"不自动触发 Terra</text>
  <text x="416" y="112" fill="#666" font-size="10">全量重做。先分类失败原因。</text>

  <text x="416" y="136" fill="#666" font-size="10">Terra 只接收未解决的 delta，</text>
  <text x="416" y="152" fill="#666" font-size="10">不重做整个 Luna 职责。</text>

  <text x="416" y="176" fill="#666" font-size="10">Sol 不是每次必须经过的关卡。</text>
  <text x="416" y="192" fill="#666" font-size="10">测试和验收足够明确时可跳过。</text>

  <text x="416" y="212" fill="#999" font-size="9" font-style="italic">保留有效证据，仅重算失效部分。</text>
</svg>
