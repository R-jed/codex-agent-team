<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" fill="none" font-family="Inter, Helvetica, 'Noto Sans SC', sans-serif">
  <rect width="1440" height="720" fill="#fafafa"/>

  <!-- User task -->
  <rect x="48" y="48" width="240" height="80" rx="0" fill="#1a1a1a"/>
  <text x="168" y="98" text-anchor="middle" fill="#fff" font-size="24" font-weight="500">用户任务</text>

  <!-- Arrow -->
  <line x1="288" y1="88" x2="368" y2="88" stroke="#1a1a1a" stroke-width="2" marker-end="url(#f-arrow)"/>

  <!-- Main session understand -->
  <rect x="368" y="40" width="280" height="96" rx="0" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="508" y="80" text-anchor="middle" fill="#1a1a1a" font-size="22" font-weight="600">主会话理解</text>
  <text x="508" y="108" text-anchor="middle" fill="#666" font-size="18">目标 · 范围 · 风险</text>
  <text x="508" y="132" text-anchor="middle" fill="#666" font-size="18">验收标准</text>

  <!-- Benefit gate -->
  <line x1="648" y1="88" x2="728" y2="88" stroke="#1a1a1a" stroke-width="2" marker-end="url(#f-arrow)"/>
  <rect x="728" y="40" width="240" height="96" rx="0" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="848" y="80" text-anchor="middle" fill="#2563eb" font-size="22" font-weight="600">委派收益门</text>
  <text x="848" y="112" text-anchor="middle" fill="#666" font-size="20">有独立依赖？</text>

  <!-- No -> stay -->
  <line x1="848" y1="136" x2="848" y2="200" stroke="#999" stroke-width="2" marker-end="url(#f-arrow-gray)"/>
  <rect x="748" y="200" width="200" height="64" rx="0" fill="#f5f5f5" stroke="#e5e5e5" stroke-width="2"/>
  <text x="848" y="242" text-anchor="middle" fill="#999" font-size="20">主会话独立完成</text>
  <text x="820" y="192" fill="#999" font-size="18">否</text>

  <!-- Yes -> contractability -->
  <line x1="968" y1="88" x2="1048" y2="88" stroke="#1a1a1a" stroke-width="2" marker-end="url(#f-arrow)"/>
  <text x="1000" y="76" fill="#2563eb" font-size="18">是</text>
  <rect x="1048" y="40" width="280" height="96" rx="0" fill="#fff" stroke="#d97706" stroke-width="2"/>
  <text x="1188" y="80" text-anchor="middle" fill="#d97706" font-size="22" font-weight="600">可合同化门</text>
  <text x="1188" y="112" text-anchor="middle" fill="#666" font-size="20">验收标准明确？</text>

  <!-- No -> clarify -->
  <line x1="1188" y1="136" x2="1188" y2="200" stroke="#999" stroke-width="2" marker-end="url(#f-arrow-gray)"/>
  <rect x="1088" y="200" width="200" height="64" rx="0" fill="#f5f5f5" stroke="#e5e5e5" stroke-width="2"/>
  <text x="1188" y="242" text-anchor="middle" fill="#999" font-size="20">主会话补齐合同</text>
  <text x="1160" y="192" fill="#999" font-size="18">否</text>

  <!-- Yes -> route -->
  <line x1="1328" y1="88" x2="1328" y2="280" stroke="#1a1a1a" stroke-width="2"/>
  <text x="1340" y="200" fill="#d97706" font-size="18">是</text>
  <line x1="1328" y1="280" x2="720" y2="280" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="720" y1="280" x2="720" y2="320" stroke="#1a1a1a" stroke-width="2" marker-end="url(#f-arrow)"/>

  <!-- Route decision -->
  <rect x="560" y="320" width="320" height="72" rx="0" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="720" y="366" text-anchor="middle" fill="#1a1a1a" font-size="22" font-weight="600">路由到角色</text>

  <!-- Three routes -->
  <line x1="620" y1="392" x2="240" y2="456" stroke="#2563eb" stroke-width="2" marker-end="url(#f-arrow-blue)"/>
  <line x1="720" y1="392" x2="720" y2="456" stroke="#d97706" stroke-width="2" marker-end="url(#f-arrow-amber)"/>
  <line x1="820" y1="392" x2="1200" y2="456" stroke="#059669" stroke-width="2" marker-end="url(#f-arrow-green)"/>

  <!-- Luna -->
  <rect x="80" y="456" width="320" height="112" rx="0" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="240" y="500" text-anchor="middle" fill="#2563eb" font-size="22" font-weight="600">Luna Max</text>
  <text x="240" y="536" text-anchor="middle" fill="#666" font-size="20">实现 · 调试 · 测试 · 搜索</text>

  <!-- Terra -->
  <rect x="560" y="456" width="320" height="112" rx="0" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="720" y="500" text-anchor="middle" fill="#d97706" font-size="22" font-weight="600">Terra XHigh</text>
  <text x="720" y="536" text-anchor="middle" fill="#666" font-size="20">未解决的技术 delta</text>

  <!-- Sol -->
  <rect x="1040" y="456" width="320" height="112" rx="0" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="1200" y="500" text-anchor="middle" fill="#059669" font-size="22" font-weight="600">Sol High</text>
  <text x="1200" y="536" text-anchor="middle" fill="#666" font-size="20">判断 · 选择性复核</text>

  <!-- Return to main -->
  <path d="M240,568 L240,620 L720,620 L720,660" stroke="#2563eb" stroke-width="2" stroke-dasharray="8,6" fill="none"/>
  <path d="M720,568 L720,660" stroke="#d97706" stroke-width="2" stroke-dasharray="8,6" fill="none"/>
  <path d="M1200,568 L1200,620 L720,620 L720,660" stroke="#059669" stroke-width="2" stroke-dasharray="8,6" fill="none"/>

  <!-- Accept -->
  <rect x="620" y="660" width="200" height="56" rx="0" fill="#1a1a1a"/>
  <text x="720" y="698" text-anchor="middle" fill="#fff" font-size="20" font-weight="500">主会话验收</text>

  <defs>
    <marker id="f-arrow" viewBox="0 0 16 16" refX="16" refY="8" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 Z" fill="#1a1a1a"/></marker>
    <marker id="f-arrow-gray" viewBox="0 0 16 16" refX="16" refY="8" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 Z" fill="#999"/></marker>
    <marker id="f-arrow-blue" viewBox="0 0 16 16" refX="16" refY="8" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 Z" fill="#2563eb"/></marker>
    <marker id="f-arrow-amber" viewBox="0 0 16 16" refX="16" refY="8" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 Z" fill="#d97706"/></marker>
    <marker id="f-arrow-green" viewBox="0 0 16 16" refX="16" refY="8" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 Z" fill="#059669"/></marker>
  </defs>
</svg>
