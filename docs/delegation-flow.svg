<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" fill="none" font-family="Inter, Helvetica, 'Noto Sans SC', sans-serif">
  <rect width="720" height="360" fill="#fafafa"/>

  <!-- User task -->
  <rect x="24" y="24" width="120" height="40" rx="0" fill="#1a1a1a"/>
  <text x="84" y="49" text-anchor="middle" fill="#fff" font-size="12" font-weight="500">用户任务</text>

  <!-- Arrow -->
  <line x1="144" y1="44" x2="184" y2="44" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#f-arrow)"/>

  <!-- Main session understand -->
  <rect x="184" y="20" width="140" height="48" rx="0" fill="#fff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="254" y="40" text-anchor="middle" fill="#1a1a1a" font-size="11" font-weight="600">主会话理解</text>
  <text x="254" y="56" text-anchor="middle" fill="#666" font-size="10">目标 · 范围 · 风险 · 验收标准</text>

  <!-- Benefit gate -->
  <line x1="324" y1="44" x2="364" y2="44" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#f-arrow)"/>
  <rect x="364" y="20" width="120" height="48" rx="0" fill="#fff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="424" y="40" text-anchor="middle" fill="#2563eb" font-size="11" font-weight="600">委派收益门</text>
  <text x="424" y="56" text-anchor="middle" fill="#666" font-size="10">有独立依赖？</text>

  <!-- No -> stay -->
  <line x1="424" y1="68" x2="424" y2="100" stroke="#999" stroke-width="1" marker-end="url(#f-arrow-gray)"/>
  <rect x="374" y="100" width="100" height="32" rx="0" fill="#f5f5f5" stroke="#e5e5e5" stroke-width="1"/>
  <text x="424" y="121" text-anchor="middle" fill="#999" font-size="10">主会话独立完成</text>
  <text x="410" y="96" fill="#999" font-size="9">否</text>

  <!-- Yes -> contractability -->
  <line x1="484" y1="44" x2="524" y2="44" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#f-arrow)"/>
  <text x="500" y="38" fill="#2563eb" font-size="9">是</text>
  <rect x="524" y="20" width="140" height="48" rx="0" fill="#fff" stroke="#d97706" stroke-width="1.2"/>
  <text x="594" y="40" text-anchor="middle" fill="#d97706" font-size="11" font-weight="600">可合同化门</text>
  <text x="594" y="56" text-anchor="middle" fill="#666" font-size="10">验收标准明确？</text>

  <!-- No -> clarify -->
  <line x1="594" y1="68" x2="594" y2="100" stroke="#999" stroke-width="1" marker-end="url(#f-arrow-gray)"/>
  <rect x="544" y="100" width="100" height="32" rx="0" fill="#f5f5f5" stroke="#e5e5e5" stroke-width="1"/>
  <text x="594" y="121" text-anchor="middle" fill="#999" font-size="10">主会话补齐合同</text>
  <text x="580" y="96" fill="#999" font-size="9">否</text>

  <!-- Yes -> route -->
  <line x1="664" y1="44" x2="664" y2="140" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="670" y="100" fill="#d97706" font-size="9">是</text>
  <line x1="664" y1="140" x2="360" y2="140" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="360" y1="140" x2="360" y2="160" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#f-arrow)"/>

  <!-- Route decision -->
  <rect x="280" y="160" width="160" height="36" rx="0" fill="#fff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="360" y="183" text-anchor="middle" fill="#1a1a1a" font-size="11" font-weight="600">路由到角色</text>

  <!-- Three routes -->
  <line x1="310" y1="196" x2="120" y2="228" stroke="#2563eb" stroke-width="1.2" marker-end="url(#f-arrow-blue)"/>
  <line x1="360" y1="196" x2="360" y2="228" stroke="#d97706" stroke-width="1.2" marker-end="url(#f-arrow-amber)"/>
  <line x1="410" y1="196" x2="600" y2="228" stroke="#059669" stroke-width="1.2" marker-end="url(#f-arrow-green)"/>

  <!-- Luna -->
  <rect x="40" y="228" width="160" height="56" rx="0" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="120" y="250" text-anchor="middle" fill="#2563eb" font-size="11" font-weight="600">Luna Max</text>
  <text x="120" y="268" text-anchor="middle" fill="#666" font-size="10">实现 · 调试 · 测试 · 搜索</text>

  <!-- Terra -->
  <rect x="280" y="228" width="160" height="56" rx="0" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="360" y="250" text-anchor="middle" fill="#d97706" font-size="11" font-weight="600">Terra XHigh</text>
  <text x="360" y="268" text-anchor="middle" fill="#666" font-size="10">未解决的技术 delta</text>

  <!-- Sol -->
  <rect x="520" y="228" width="160" height="56" rx="0" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="600" y="250" text-anchor="middle" fill="#059669" font-size="11" font-weight="600">Sol High</text>
  <text x="600" y="268" text-anchor="middle" fill="#666" font-size="10">判断 · 选择性复核</text>

  <!-- Return to main -->
  <path d="M120,284 L120,310 L360,310 L360,330" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,3" fill="none"/>
  <path d="M360,284 L360,330" stroke="#d97706" stroke-width="1" stroke-dasharray="4,3" fill="none"/>
  <path d="M600,284 L600,310 L360,310 L360,330" stroke="#059669" stroke-width="1" stroke-dasharray="4,3" fill="none"/>

  <!-- Accept -->
  <rect x="310" y="330" width="100" height="28" rx="0" fill="#1a1a1a"/>
  <text x="360" y="349" text-anchor="middle" fill="#fff" font-size="10" font-weight="500">主会话验收</text>

  <defs>
    <marker id="f-arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="f-arrow-gray" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#999"/></marker>
    <marker id="f-arrow-blue" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="f-arrow-amber" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/></marker>
    <marker id="f-arrow-green" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
  </defs>
</svg>
