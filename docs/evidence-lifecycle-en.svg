<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 580" fill="none" font-family="Inter, Helvetica, 'Noto Sans SC', sans-serif">
  <rect width="1440" height="580" fill="#fafafa"/>

  <!-- Title -->
  <text x="48" y="56" fill="#1a1a1a" font-size="26" font-weight="600">Evidence Lifecycle</text>

  <!-- Create -->
  <rect x="48" y="96" width="280" height="144" rx="0" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="188" y="144" text-anchor="middle" fill="#1a1a1a" font-size="22" font-weight="600">Create</text>
  <text x="188" y="180" text-anchor="middle" fill="#666" font-size="20">Agent executes task</text>
  <text x="188" y="212" text-anchor="middle" fill="#666" font-size="20">produces results and evidence</text>

  <!-- Classify -->
  <line x1="328" y1="168" x2="408" y2="168" stroke="#1a1a1a" stroke-width="2" marker-end="url(#e-arrow)"/>
  <rect x="408" y="96" width="280" height="144" rx="0" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="548" y="144" text-anchor="middle" fill="#2563eb" font-size="22" font-weight="600">Classify</text>
  <text x="548" y="176" text-anchor="middle" fill="#666" font-size="18">deterministic</text>
  <text x="548" y="200" text-anchor="middle" fill="#666" font-size="18">repository_fact</text>
  <text x="548" y="224" text-anchor="middle" fill="#666" font-size="18">model_judgment</text>

  <!-- Reuse -->
  <line x1="688" y1="168" x2="768" y2="168" stroke="#1a1a1a" stroke-width="2" marker-end="url(#e-arrow)"/>
  <rect x="768" y="96" width="280" height="144" rx="0" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="908" y="144" text-anchor="middle" fill="#059669" font-size="22" font-weight="600">Reuse</text>
  <text x="908" y="180" text-anchor="middle" fill="#666" font-size="20">later Agents reuse by default</text>
  <text x="908" y="212" text-anchor="middle" fill="#666" font-size="20">reused while dependencies valid</text>

  <!-- Invalidate -->
  <line x1="1048" y1="168" x2="1128" y2="168" stroke="#1a1a1a" stroke-width="2" marker-end="url(#e-arrow)"/>
  <rect x="1128" y="96" width="264" height="144" rx="0" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1260" y="144" text-anchor="middle" fill="#dc2626" font-size="22" font-weight="600">Invalidate</text>
  <text x="1260" y="176" text-anchor="middle" fill="#666" font-size="14">when file/assumption</text>
  <text x="1260" y="196" text-anchor="middle" fill="#666" font-size="14">changes</text>

  <!-- Types detail -->
  <rect x="48" y="304" width="440" height="224" rx="0" fill="#fff" stroke="#e5e5e5" stroke-width="2"/>
  <text x="80" y="352" fill="#1a1a1a" font-size="22" font-weight="600">Evidence Types</text>
  <line x1="80" y1="368" x2="456" y2="368" stroke="#e5e5e5" stroke-width="1"/>

  <circle cx="96" cy="396" r="8" fill="#059669"/>
  <text x="120" y="404" fill="#1a1a1a" font-size="20" font-weight="500">deterministic</text>
  <text x="120" y="432" fill="#999" font-size="18">deterministic output, safe to reuse</text>

  <circle cx="96" cy="460" r="8" fill="#2563eb"/>
  <text x="120" y="468" fill="#1a1a1a" font-size="20" font-weight="500">repository_fact</text>
  <text x="120" y="496" fill="#999" font-size="18">repo facts, safe to reuse</text>

  <circle cx="96" cy="520" r="8" fill="#d97706"/>
  <text x="120" y="528" fill="#1a1a1a" font-size="20" font-weight="500">model_judgment</text>
  <text x="120" y="556" fill="#999" font-size="18">hypothesis, challengeable</text>

  <!-- Key principle -->
  <rect x="560" y="304" width="832" height="224" rx="0" fill="#fff" stroke="#e5e5e5" stroke-width="2"/>
  <text x="592" y="352" fill="#1a1a1a" font-size="22" font-weight="600">Key Principle</text>
  <line x1="592" y1="368" x2="1360" y2="368" stroke="#e5e5e5" stroke-width="1"/>
  <text x="592" y="408" fill="#666" font-size="16">Changed input invalidates only dependent evidence.</text>
  <text x="592" y="432" fill="#666" font-size="16">Later Agents do not rescan the repo or rerun</text>
  <text x="592" y="456" fill="#666" font-size="16">unrelated tests.</text>
  <text x="592" y="488" fill="#666" font-size="16">model_judgment is a hypothesis;</text>
  <text x="592" y="512" fill="#666" font-size="16">later judgment can challenge it.</text>
  <text x="592" y="536" fill="#666" font-size="16">deterministic and repository_fact are safe</text>
  <text x="592" y="552" fill="#666" font-size="16">to reuse while dependencies hold.</text>

  <defs>
    <marker id="e-arrow" viewBox="0 0 16 16" refX="16" refY="8" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 Z" fill="#1a1a1a"/></marker>
  </defs>
</svg>
