<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" fill="none" font-family="Inter, Helvetica, 'Noto Sans SC', sans-serif">
  <rect width="720" height="280" fill="#fafafa"/>

  <!-- Title -->
  <text x="24" y="28" fill="#1a1a1a" font-size="13" font-weight="600">Evidence Lifecycle</text>

  <!-- Create -->
  <rect x="24" y="48" width="140" height="72" rx="0" fill="#fff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="94" y="72" text-anchor="middle" fill="#1a1a1a" font-size="11" font-weight="600">Create</text>
  <text x="94" y="90" text-anchor="middle" fill="#666" font-size="10">Agent executes task</text>
  <text x="94" y="106" text-anchor="middle" fill="#666" font-size="10">produces results and evidence</text>

  <!-- Classify -->
  <line x1="164" y1="84" x2="204" y2="84" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#e-arrow)"/>
  <rect x="204" y="48" width="140" height="72" rx="0" fill="#fff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="274" y="72" text-anchor="middle" fill="#2563eb" font-size="11" font-weight="600">Classify</text>
  <text x="274" y="90" text-anchor="middle" fill="#666" font-size="10">deterministic</text>
  <text x="274" y="106" text-anchor="middle" fill="#666" font-size="10">repository_fact / model_judgment</text>

  <!-- Reuse -->
  <line x1="344" y1="84" x2="384" y2="84" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#e-arrow)"/>
  <rect x="384" y="48" width="140" height="72" rx="0" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="454" y="72" text-anchor="middle" fill="#059669" font-size="11" font-weight="600">Reuse</text>
  <text x="454" y="90" text-anchor="middle" fill="#666" font-size="10">later Agents reuse by default</text>
  <text x="454" y="106" text-anchor="middle" fill="#666" font-size="10">reused while dependencies valid</text>

  <!-- Invalidate -->
  <line x1="524" y1="84" x2="564" y2="84" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#e-arrow)"/>
  <rect x="564" y="48" width="132" height="72" rx="0" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="630" y="72" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="600">Invalidate</text>
  <text x="630" y="90" text-anchor="middle" fill="#666" font-size="10">when file/assumption changes</text>
  <text x="630" y="106" text-anchor="middle" fill="#666" font-size="10">invalidates only dependent evidence</text>

  <!-- Types detail -->
  <rect x="24" y="152" width="220" height="112" rx="0" fill="#fff" stroke="#e5e5e5" stroke-width="1"/>
  <text x="40" y="176" fill="#1a1a1a" font-size="11" font-weight="600">Evidence Types</text>
  <line x1="40" y1="184" x2="228" y2="184" stroke="#e5e5e5" stroke-width="0.5"/>

  <circle cx="48" cy="200" r="4" fill="#059669"/>
  <text x="60" y="204" fill="#1a1a1a" font-size="10" font-weight="500">deterministic</text>
  <text x="60" y="218" fill="#999" font-size="9">deterministic output, safe to reuse</text>

  <circle cx="48" cy="234" r="4" fill="#2563eb"/>
  <text x="60" y="238" fill="#1a1a1a" font-size="10" font-weight="500">repository_fact</text>
  <text x="60" y="252" fill="#999" font-size="9">repo facts, safe to reuse</text>

  <circle cx="48" cy="248" r="4" fill="#d97706" transform="translate(0,-14)"/>
  <text x="60" y="252" fill="#1a1a1a" font-size="10" font-weight="500" transform="translate(0,-14)">model_judgment</text>
  <text x="60" y="252" fill="#999" font-size="9" transform="translate(0,0)">hypothesis, challengeable</text>

  <!-- Key principle -->
  <rect x="280" y="152" width="416" height="112" rx="0" fill="#fff" stroke="#e5e5e5" stroke-width="1"/>
  <text x="296" y="176" fill="#1a1a1a" font-size="11" font-weight="600">Key Principle</text>
  <line x1="296" y1="184" x2="680" y2="184" stroke="#e5e5e5" stroke-width="0.5"/>
  <text x="296" y="204" fill="#666" font-size="10">Changed input invalidates only dependent evidence. Later Agents</text>
  <text x="296" y="220" fill="#666" font-size="10">do not rescan the repo or rerun unrelated tests.</text>
  <text x="296" y="244" fill="#666" font-size="10">model_judgment is a hypothesis; later judgment can challenge it.</text>
  <text x="296" y="260" fill="#666" font-size="10">deterministic and repository_fact are safe to reuse while dependencies hold.</text>

  <defs>
    <marker id="e-arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
  </defs>
</svg>
