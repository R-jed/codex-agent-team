<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" fill="none" font-family="Inter, Helvetica, 'Noto Sans SC', sans-serif">
  <rect width="720" height="240" fill="#fafafa"/>

  <!-- Title -->
  <text x="24" y="28" fill="#1a1a1a" font-size="13" font-weight="600">Failure Classification and Escalation</text>

  <!-- Failure node -->
  <rect x="24" y="52" width="140" height="44" rx="0" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="94" y="72" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="600">Luna fails acceptance</text>
  <text x="94" y="88" text-anchor="middle" fill="#999" font-size="9">classify first, then escalate</text>

  <!-- Four branches -->
  <line x1="164" y1="64" x2="200" y2="64" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="164" y1="74" x2="200" y2="108" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="164" y1="74" x2="200" y2="152" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="164" y1="84" x2="200" y2="196" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Mechanical -->
  <rect x="200" y="44" width="160" height="40" rx="0" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="280" y="60" text-anchor="middle" fill="#2563eb" font-size="10" font-weight="600">Mechanical defect</text>
  <text x="280" y="76" text-anchor="middle" fill="#666" font-size="9">→ focused Luna fix</text>

  <!-- Contract gap -->
  <rect x="200" y="88" width="160" height="40" rx="0" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="280" y="104" text-anchor="middle" fill="#d97706" font-size="10" font-weight="600">Contract gap</text>
  <text x="280" y="120" text-anchor="middle" fill="#666" font-size="9">→ main session repairs contract</text>

  <!-- Capability gap -->
  <rect x="200" y="132" width="160" height="40" rx="0" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="280" y="148" text-anchor="middle" fill="#d97706" font-size="10" font-weight="600">Capability gap</text>
  <text x="280" y="164" text-anchor="middle" fill="#666" font-size="9">→ Terra investigates delta only</text>

  <!-- Judgment gap -->
  <rect x="200" y="176" width="160" height="40" rx="0" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="280" y="192" text-anchor="middle" fill="#059669" font-size="10" font-weight="600">Judgment gap</text>
  <text x="280" y="208" text-anchor="middle" fill="#666" font-size="9">→ main session decides, or uses Sol</text>

  <!-- Key principles -->
  <rect x="400" y="44" width="300" height="172" rx="0" fill="#fff" stroke="#e5e5e5" stroke-width="1"/>
  <text x="416" y="68" fill="#1a1a1a" font-size="11" font-weight="600">Key Principles</text>
  <line x1="416" y1="76" x2="684" y2="76" stroke="#e5e5e5" stroke-width="0.5"/>

  <text x="416" y="96" fill="#666" font-size="10">A mediocre Luna result does not auto-trigger Terra</text>
  <text x="416" y="112" fill="#666" font-size="10">full redo. Classify the failure first.</text>

  <text x="416" y="136" fill="#666" font-size="10">Terra receives only the unresolved delta,</text>
  <text x="416" y="152" fill="#666" font-size="10">not the full Luna responsibility.</text>

  <text x="416" y="176" fill="#666" font-size="10">Sol is not a mandatory gate for every task.</text>
  <text x="416" y="192" fill="#666" font-size="10">Skipped when tests and acceptance are strong enough.</text>

  <text x="416" y="212" fill="#999" font-size="9" font-style="italic">Preserve valid evidence; recompute only invalidated parts.</text>
</svg>
