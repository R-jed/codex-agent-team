<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 480" fill="none" font-family="Inter, Helvetica, 'Noto Sans SC', sans-serif">
  <rect width="1440" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="48" y="56" fill="#1a1a1a" font-size="26" font-weight="600">Failure Classification and Escalation</text>

  <!-- Failure node -->
  <rect x="48" y="104" width="280" height="88" rx="0" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="188" y="144" text-anchor="middle" fill="#dc2626" font-size="22" font-weight="600">Luna fails acceptance</text>
  <text x="188" y="176" text-anchor="middle" fill="#999" font-size="18">classify first, then escalate</text>

  <!-- Four branches -->
  <line x1="328" y1="128" x2="400" y2="128" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="328" y1="148" x2="400" y2="216" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="328" y1="148" x2="400" y2="304" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="328" y1="168" x2="400" y2="392" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Mechanical -->
  <rect x="400" y="88" width="320" height="80" rx="0" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="560" y="120" text-anchor="middle" fill="#2563eb" font-size="20" font-weight="600">Mechanical defect</text>
  <text x="560" y="152" text-anchor="middle" fill="#666" font-size="18">→ focused Luna fix</text>

  <!-- Contract gap -->
  <rect x="400" y="176" width="320" height="80" rx="0" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="560" y="208" text-anchor="middle" fill="#d97706" font-size="20" font-weight="600">Contract gap</text>
  <text x="560" y="240" text-anchor="middle" fill="#666" font-size="18">→ main session repairs contract</text>

  <!-- Capability gap -->
  <rect x="400" y="264" width="320" height="80" rx="0" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="560" y="296" text-anchor="middle" fill="#d97706" font-size="20" font-weight="600">Capability gap</text>
  <text x="560" y="324" text-anchor="middle" fill="#666" font-size="16">→ Terra investigates</text>
  <text x="560" y="348" text-anchor="middle" fill="#666" font-size="16">delta only</text>

  <!-- Judgment gap -->
  <rect x="400" y="352" width="320" height="80" rx="0" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="560" y="384" text-anchor="middle" fill="#059669" font-size="20" font-weight="600">Judgment gap</text>
  <text x="560" y="416" text-anchor="middle" fill="#666" font-size="18">→ main session decides, or uses Sol</text>

  <!-- Key principles -->
  <rect x="800" y="88" width="600" height="344" rx="0" fill="#fff" stroke="#e5e5e5" stroke-width="2"/>
  <text x="832" y="136" fill="#1a1a1a" font-size="22" font-weight="600">Key Principles</text>
  <line x1="832" y1="152" x2="1368" y2="152" stroke="#e5e5e5" stroke-width="1"/>

  <text x="832" y="192" fill="#666" font-size="18">A mediocre Luna result does not</text>
  <text x="832" y="216" fill="#666" font-size="18">auto-trigger Terra full redo.</text>
  <text x="832" y="240" fill="#666" font-size="18">Classify the failure first.</text>

  <text x="832" y="272" fill="#666" font-size="20">Terra receives only the unresolved delta,</text>
  <text x="832" y="304" fill="#666" font-size="20">not the full Luna responsibility.</text>

  <text x="832" y="352" fill="#666" font-size="18">Sol is not a mandatory gate for every task.</text>
  <text x="832" y="380" fill="#666" font-size="18">Skipped when tests and acceptance are</text>
  <text x="832" y="408" fill="#666" font-size="18">strong enough.</text>

  <text x="832" y="444" fill="#999" font-size="16" font-style="italic">Preserve valid evidence;</text>
  <text x="832" y="468" fill="#999" font-size="16" font-style="italic">recompute only invalidated parts.</text>
</svg>
