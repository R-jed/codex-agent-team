<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" fill="none" font-family="Inter, Helvetica, 'Noto Sans SC', sans-serif">
  <rect width="1440" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="48" y="56" fill="#1a1a1a" font-size="26" font-weight="600">证据生命周期</text>

  <!-- Create -->
  <rect x="48" y="96" width="280" height="144" rx="0" fill="#fff" stroke="#1a1a1a" stroke-width="4.8"/>
  <text x="188" y="144" text-anchor="middle" fill="#1a1a1a" font-size="22" font-weight="600">产生</text>
  <text x="188" y="180" text-anchor="middle" fill="#666" font-size="20">智能体执行任务</text>
  <text x="188" y="212" text-anchor="middle" fill="#666" font-size="20">产出结果与证据</text>

  <!-- Classify -->
  <line x1="328" y1="168" x2="408" y2="168" stroke="#1a1a1a" stroke-width="4.8" marker-end="url(#e-arrow)"/>
  <rect x="408" y="96" width="280" height="144" rx="0" fill="#fff" stroke="#2563eb" stroke-width="4.8"/>
  <text x="548" y="144" text-anchor="middle" fill="#2563eb" font-size="22" font-weight="600">分类</text>
  <text x="548" y="180" text-anchor="middle" fill="#666" font-size="20">deterministic</text>
  <text x="548" y="212" text-anchor="middle" fill="#666" font-size="20">repository_fact / model_judgment</text>

  <!-- Reuse -->
  <line x1="688" y1="168" x2="768" y2="168" stroke="#1a1a1a" stroke-width="4.8" marker-end="url(#e-arrow)"/>
  <rect x="768" y="96" width="280" height="144" rx="0" fill="#ecfdf5" stroke="#059669" stroke-width="4.8"/>
  <text x="908" y="144" text-anchor="middle" fill="#059669" font-size="22" font-weight="600">复用</text>
  <text x="908" y="180" text-anchor="middle" fill="#666" font-size="20">后续 Agent 默认使用</text>
  <text x="908" y="212" text-anchor="middle" fill="#666" font-size="20">依赖有效时持续复用</text>

  <!-- Invalidate -->
  <line x1="1048" y1="168" x2="1128" y2="168" stroke="#1a1a1a" stroke-width="4.8" marker-end="url(#e-arrow)"/>
  <rect x="1128" y="96" width="264" height="144" rx="0" fill="#fef2f2" stroke="#dc2626" stroke-width="4.8"/>
  <text x="1260" y="144" text-anchor="middle" fill="#dc2626" font-size="22" font-weight="600">失效</text>
  <text x="1260" y="180" text-anchor="middle" fill="#666" font-size="20">依赖文件/前提变更时</text>
  <text x="1260" y="212" text-anchor="middle" fill="#666" font-size="20">仅使依赖它的证据失效</text>

  <!-- Types detail -->
  <rect x="48" y="304" width="440" height="224" rx="0" fill="#fff" stroke="#e5e5e5" stroke-width="4"/>
  <text x="80" y="352" fill="#1a1a1a" font-size="22" font-weight="600">证据类型</text>
  <line x1="80" y1="368" x2="456" y2="368" stroke="#e5e5e5" stroke-width="2"/>

  <circle cx="96" cy="400" r="4" fill="#059669"/>
  <text x="120" y="408" fill="#1a1a1a" font-size="20" font-weight="500">deterministic</text>
  <text x="120" y="436" fill="#999" font-size="18">确定性输出，可安全复用</text>

  <circle cx="96" cy="468" r="4" fill="#2563eb"/>
  <text x="120" y="476" fill="#1a1a1a" font-size="20" font-weight="500">repository_fact</text>
  <text x="120" y="504" fill="#999" font-size="18">仓库事实，可安全复用</text>

  <circle cx="96" cy="496" r="4" fill="#d97706" transform="translate(0,-14)"/>
  <text x="120" y="504" fill="#1a1a1a" font-size="20" font-weight="500" transform="translate(0,-14)">model_judgment</text>
  <text x="120" y="504" fill="#999" font-size="18" transform="translate(0,0)">假设性质，可被后续挑战</text>

  <!-- Key principle -->
  <rect x="560" y="304" width="832" height="224" rx="0" fill="#fff" stroke="#e5e5e5" stroke-width="4"/>
  <text x="592" y="352" fill="#1a1a1a" font-size="22" font-weight="600">核心原则</text>
  <line x1="592" y1="368" x2="1360" y2="368" stroke="#e5e5e5" stroke-width="2"/>
  <text x="592" y="408" fill="#666" font-size="20">变更输入仅使依赖它的证据失效，不会强制所有后续 Agent</text>
  <text x="592" y="440" fill="#666" font-size="20">重新扫描仓库或重跑无关测试。</text>
  <text x="592" y="488" fill="#666" font-size="20">model_judgment 是假设，后续判断可以挑战它。</text>
  <text x="592" y="520" fill="#666" font-size="20">deterministic 和 repository_fact 在依赖有效期内可安全复用。</text>

  <defs>
    <marker id="e-arrow" viewBox="0 0 16 16" refX="16" refY="8" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0.0 L8,8.0 L0,16.0 Z" fill="#1a1a1a"/></marker>
  </defs>
</svg>
